{% extends "base.html" %}
{% load static %}
{% load bootstrap %}
{% load i18n widget_tweaks %}
{% block content %}
    <h2>{% trans "Upload Sequence Files and Run COWSNPhR Analyses"%}</h2>
    <br>
    <div id="upload-div" class="center" style="width: 600px;"></div>
    <br>
    <form action={% url 'cowsnphr:upload_cowsnphr_files' cowsnphr_pk=cowsnphr.pk %} class="dropzone" id="myDropzone" enctype="multipart/form-data" method="post" name="file-form">
        <div class="dz-message needsclick">
            {% trans "Drop files to upload or click here"%}<br>
            <i class="fas fa-cloud-upload-alt fa-4x"></i>
        </div>
    {% csrf_token %}
    </form>
    <br>

    <button id="submit" class="btn btn-lg btn-success">{% trans "Upload Files"%}</button>

<link rel="stylesheet" type="text/css" href="{% static 'css/basic.css' %}"/>
<link rel="stylesheet" type="text/css" href="{% static 'css/dropzone.css' %}"/>
<script src="{% static 'js/dropzone.js' %}"></script>
<script src="{% static 'js/jquery-3.3.1.min.js' %}"></script>
<script type="text/javascript">
    function progressSpinner() {
        var spinnerdiv = document.getElementById('upload-div');
        let ele = document.getElementById('spindiv');
        if (ele === null){
            let div = document.createElement('div');
            div.setAttribute('class', 'loader');
            div.id = 'spindiv';
            let text = document.createElement('H4');
            let message = document.createTextNode('File upload in progress. Do not refresh this page!');
            text.appendChild(message);
            spinnerdiv.appendChild(text);
            spinnerdiv.appendChild(div);
        }
    }
    Dropzone.options.myDropzone = {
    // Prevents Dropzone from uploading dropped files immediately
    autoProcessQueue: false,
    addRemoveLinks: true,
    createImageThumbnails: false,
    maxFilesize: 2048, // This is in MB. Shouldn't ever have files bigger than this.
    parallelUploads: 4, // Number of files allowed to upload at once. Keep this number low to keep memory usage low
    uploadMultiple: true,
    maxFiles: 500,
    timeout: 3600000,
    init : function() {
        let myDropzone = this;
        var submitButton = document.querySelector("#submit");
        submitButton.addEventListener("click", function(e) {
        e.preventDefault();
        e.stopPropagation();
        progressSpinner();
        // Tell Dropzone to process all queued files.
        myDropzone.processQueue();
        
        });
        this.on("processing", function() {
            this.options.autoProcessQueue = true;
        });
        this.on("queuecomplete", function (file) {
        window.location.replace("{% url 'cowsnphr:cowsnphr_processing' cowsnphr_pk=cowsnphr.pk %}");
        });
    }
    }
</script>
{% endblock %}
