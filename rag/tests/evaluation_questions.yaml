version: 1
evaluation_semantics:
  expected_sources: 'Any-match: at least one listed source should appear in the evaluated top-k results.'
  expected_terms: Terms expected in the retrieved chunk content; matching should initially be case-insensitive.
  expected_heading_terms: Terms expected in the retrieved chunk heading path.
  should_abstain: No sufficiently relevant documentation result should be treated as a supported answer.
  expected_access_level: Used to verify internal-content filtering.
  forbidden_terms: Terms that must not occur in retrieved content; matching is case-insensitive.
  maximum_top_score: Optional per-question maximum top retrieval score for a should_abstain question.
