trigger:
  branches:
    include:
      - main
      - dev
      - foodport

pr:
  branches:
    include:
      - main
      - dev
      - foodport

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - bash: python3 -m unittest -v utility.test_production_deploy
    displayName: Test production deployment safeguards

  - bash: python3 -m unittest -v utility.test_documentation
    displayName: Check documentation links

  - bash: |
      set -euo pipefail

      project="foodport-ci-${BUILD_BUILDID}"
      browser_project="${project}-browser"

      cleanup() {
        docker compose -p "$browser_project" \
          -f docker-compose-test.yml \
          -f docker-compose-browser-test.yml \
          down --volumes --remove-orphans
        docker compose -p "$project" \
          -f docker-compose-test.yml \
          down --volumes --remove-orphans
        # This Microsoft-hosted agent is ephemeral; free test image/cache space
        # before the deployment images are built in the next step.
        docker system prune --all --force
      }
      trap cleanup EXIT

      docker compose -p "$project" \
        -f docker-compose-test.yml \
        run --build --rm test-runner \
        /bin/bash -lc \
        "python -m pip check && \
         python -m unittest -v utility.test_pipeline_syntax && \
         bash utility/compile_python_requirements.sh --check && \
         python manage.py check && \
         flake8 --select=E9,F63,F7,F82 && \
         python manage.py compilemessages && \
         coverage run -m pytest -q && \
         coverage report --show-missing"

      git diff --exit-code -- olc_webportalv2/locale

      docker compose -p "$browser_project" \
        -f docker-compose-test.yml \
        -f docker-compose-browser-test.yml \
        up --build --abort-on-container-exit --exit-code-from test-runner test-runner
    displayName: Run Django, translation, and browser validation

  - bash: |
      set -euo pipefail

      temporary_env=0
      project="foodport-image-ci-${BUILD_BUILDID}"
      batch_container="${project}-batch-smoke"
      if [ ! -e env ]; then
        : > env
        temporary_env=1
      fi
      cleanup() {
        docker rm -f "$batch_container" >/dev/null 2>&1 || true
        if [ "$temporary_env" -eq 1 ]; then
          rm -- env
        fi
      }
      trap cleanup EXIT

      docker compose --parallel 1 -p "$project" \
        build web batch storage redmine nginx rag

      docker compose -p "$project" run \
        --detach --no-deps --name "$batch_container" batch

      for attempt in $(seq 1 30); do
        if docker exec "$batch_container" python -c "import json, urllib.request; response = urllib.request.urlopen('http://localhost:5000/health', timeout=2); assert json.load(response) == {'status': 'ok'}" >/dev/null 2>&1; then
          echo "Batch startup and /health smoke test passed"
          break
        fi
        if [ "$attempt" -eq 30 ]; then
          docker logs "$batch_container" || true
          echo "ERROR: Batch did not become healthy." >&2
          exit 1
        fi
        sleep 2
      done

      docker compose -p "$project" \
        run --rm --no-deps \
        -e SECRET_KEY=ci-placeholder \
        -e EMAIL_RELAY_SECRET=ci-placeholder \
        -e EMAIL_HOST_USER=ci-placeholder \
        -e EMAIL_HOST_PASSWORD=ci-placeholder \
        -e DB_NAME=ci-placeholder \
        -e DB_USER=ci-placeholder \
        -e DB_PASS=ci-placeholder \
        -e DB_SERVICE=localhost \
        -e DB_PORT=5432 \
        -e SENTRY_DSN= \
        -e MICROSOFT_AUTH_ENABLED=false \
        -e DJANGO_READ_DOT_ENV_FILE=false \
        web \
        python -c "import logging.config, os; from config.settings.prod import LOGGING; logging.config.dictConfig(LOGGING); paths=('manage.py', 'olc_webportalv2/taskapp/celery.py'); assert os.geteuid() != 0 and os.getegid() != 0, 'portal must run with non-root UID/GID'; assert all(os.access(path, os.R_OK) for path in paths), 'portal source must be readable by non-root UID'; assert os.access('worker_launcher.sh', os.X_OK), 'worker launcher must be executable'; print(f'Portal UID:GID: {os.geteuid()}:{os.getegid()}')"

      docker compose -p "$project" \
        run --rm --no-deps \
        -v "$PWD:/workspace:ro" \
        -w /workspace \
        batch \
        /bin/bash -lc \
        "python -m pip install --no-cache-dir pip-tools==7.7.0 && \
         bash utility/compile_python_requirements.sh --check"

      docker compose -p "$project" \
        run --rm --no-deps \
        -v "$PWD/rag/tests:/app/tests:ro" \
        -e RAG_DB_PASSWORD=ci-placeholder \
        rag \
        python -m pytest -q /app/tests
    displayName: Build and validate deployment images
