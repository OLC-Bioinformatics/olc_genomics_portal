services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: foodport_test
      POSTGRES_USER: foodport_test
      POSTGRES_PASSWORD: ${FOODPORT_TEST_DB_PASSWORD:-foodport_test_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodport_test -d foodport_test"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - foodport-test-postgres-data:/var/lib/postgresql/data

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_READ_DOT_ENV_FILE: "false"
      ENVIRONMENT: TEST
      SECRET_KEY: foodport-test-only-secret-key
      EMAIL_RELAY_SECRET: foodport-test-only-email-secret
      EMAIL_HOST_USER: test@example.invalid
      EMAIL_HOST_PASSWORD: not-used
      SENTRY_DSN: ""
      MICROSOFT_AUTH_ENABLED: "false"
      FOODPORT_TEST_DB_NAME: foodport_test
      FOODPORT_TEST_DB_USER: foodport_test
      FOODPORT_TEST_DB_PASSWORD: ${FOODPORT_TEST_DB_PASSWORD:-foodport_test_only}
      FOODPORT_TEST_DB_HOST: postgres
      FOODPORT_TEST_DB_PORT: "5432"
      FOODPORT_TEST_MEDIA_ROOT: /tmp/foodport-test-media
      COVERAGE_FILE: /tmp/foodport-test.coverage
    command:
      - /bin/bash
      - -lc
      - coverage run -m pytest -q && coverage report --show-missing
    volumes:
      - .:/data/web
    working_dir: /data/web

volumes:
  foodport-test-postgres-data:
