# App deployment pipeline for olc_genomics_portal
# This pipeline updates the portal VM and always runs docker compose up -d --build.

trigger:
  branches:
    include:
      - main

pr: none

# This pipeline connects directly to a private portal VM over SSH.
# It defaults to the Managed DevOps Pool so the agent can reach the private endpoint.
parameters:
- name: useHostedAgent
  type: boolean
  default: false
- name: hostedVmImage
  type: string
  default: 'ubuntu-latest'

variables:
- name: TARGET_HOST
  value: '10.148.57.4'
- name: TARGET_SSH_USER
  value: 'cfiaadmin'
- name: TARGET_SSH_PORT
  value: '22'
- name: REPO_DIR
  value: '/home/cfiaadmin/FoodPort/olc_genomics_portal'

stages:
- stage: UpdateProductionPortal
  displayName: 'Update production portal'
  condition: succeeded()
  jobs:
  - job: UpdatePortal
    displayName: Update production portal
    pool:
      ${{ if eq(parameters.useHostedAgent, true) }}:
        vmImage: ${{ parameters.hostedVmImage }}
      ${{ if ne(parameters.useHostedAgent, true) }}:
        name: CFDC-FoodPort-MDP-pool
    steps:
    - checkout: self

    - task: DownloadSecureFile@1
      name: sshKey
      inputs:
        secureFile: 'prod_ssh_key'

    - task: DownloadSecureFile@1
      name: rootCA
      inputs:
        secureFile: 'GoC-GdC-Root-A.crt'

    - script: |
        chmod 600 "$(sshKey.secureFilePath)"
        scp -o StrictHostKeyChecking=no \
            -i "$(sshKey.secureFilePath)" \
            -P "$(TARGET_SSH_PORT)" \
            "$(rootCA.secureFilePath)" \
            "$(TARGET_SSH_USER)@$(TARGET_HOST):$(REPO_DIR)/GoC-GdC-Root-A.crt"
        ssh -o StrictHostKeyChecking=no -i "$(sshKey.secureFilePath)" -p "$(TARGET_SSH_PORT)" "$(TARGET_SSH_USER)@$(TARGET_HOST)" <<'EOF'
          set -e
          cd "/home/cfiaadmin/FoodPort/olc_genomics_portal"

          git fetch origin
          git reset --hard origin/main

          # Nginx serves these public assets as www-data; restore access after checkout.
          find olc_webportalv2/static/css olc_webportalv2/static/js -type d -exec chmod a+rx {} +
          find olc_webportalv2/static/css olc_webportalv2/static/js -type f -exec chmod a+r {} +

          docker compose down
          docker compose up -d --build
        EOF
      displayName: Update portal on app VM
