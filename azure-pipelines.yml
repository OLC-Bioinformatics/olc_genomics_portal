# Azure DevOps pipeline resource mappings:
# - fullInfra: source pipeline name for full infrastructure provisioning
# - devVm: source pipeline name for dev VM provisioning
#
# Update the source values below if the actual DevOps pipeline display
# names differ from the examples used here.
resources:
  pipelines:
  - pipeline: fullInfra
    source: 'foodport-tf'
    trigger: none
  - pipeline: devVm
    source: 'foodport-tf (964)'
    trigger: none

# The BootstrapRemoteVm stage SSHs into the target VM.
# For private endpoint / private network access, use a self-hosted agent pool.
parameters:
- name: deployEnvironment
  type: string
  default: dev
  values:
    - dev
    - prod
- name: infrastructure
  type: string
  default: dev-vm
  values:
    - dev-vm
    - full-infra
    - none
- name: bootstrapRemoteVm
  type: boolean
  default: true
- name: useHostedAgent
  type: boolean
  default: false
- name: hostedVmImage
  type: string
  default: 'ubuntu-latest'
- name: selfHostedPool
  type: string
  default: 'foodport-self-hosted'

trigger: none

variables:
- name: DEPLOY_ENVIRONMENT
  value: ${{ parameters.deployEnvironment }}
- ${{ if eq(parameters.deployEnvironment, 'prod') }}:
  - name: DJANGO_SERVER_NAME
    value: 'foodport-dev.cloud-nuage.inspection.gc.ca'
- ${{ if eq(parameters.deployEnvironment, 'dev') }}:
  - name: DJANGO_SERVER_NAME
    value: '_'
- ${{ if eq(parameters.deployEnvironment, 'prod') }}:
  - name: REDMINE_SERVER_NAME
    value: 'redmine-dev.cloud-nuage.inspection.gc.ca'
- ${{ if eq(parameters.deployEnvironment, 'dev') }}:
  - name: REDMINE_SERVER_NAME
    value: '_'
- name: TARGET_HOST
  value: ''
- name: TARGET_SSH_USER
  value: 'cfiaadmin'
- name: TARGET_SSH_PORT
  value: '22'

stages:
- stage: EnsureSelfHostedAgent
  displayName: 'Ensure self-hosted agent'
  condition: and(ne(parameters.useHostedAgent, true), eq(${{ parameters.bootstrapRemoteVm }}, true), ne('${{ parameters.infrastructure }}', 'none'))
  jobs:
  - job: EnsureAgent
    displayName: 'Ensure self-hosted agent is available'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: none
    - script: |
        set -euo pipefail

        if [ -z "${SYSTEM_ACCESSTOKEN:-}" ]; then
          echo "##vso[task.logissue type=error]SYSTEM_ACCESSTOKEN is unavailable. Enable Allow scripts to access the OAuth token in the pipeline settings."
          exit 1
        fi

        python3 - <<'PY'
        import base64
        import json
        import os
        import sys
        import time
        import urllib.parse
        import urllib.request

        org_uri = os.environ['SYSTEM_COLLECTIONURI'].rstrip('/')
        project = os.environ['SYSTEM_TEAMPROJECT']
        pool_name = os.environ['SELF_HOSTED_POOL']
        pipeline_id = os.environ['SELF_HOSTED_BOOTSTRAP_PIPELINE_ID']
        wait_seconds = int(os.environ.get('SELF_HOSTED_AGENT_WAIT_SECONDS', '900'))
        interval = int(os.environ.get('SELF_HOSTED_AGENT_POLL_INTERVAL', '30'))
        token = os.environ['SYSTEM_ACCESSTOKEN']

        auth = base64.b64encode(f':{token}'.encode()).decode()
        headers = {
            'Authorization': f'Basic {auth}',
            'Content-Type': 'application/json'
        }

        def http_request(path, method='GET', body=None):
            url = f'{org_uri}/{project}{path}'
            data = None
            if body is not None:
                data = json.dumps(body).encode('utf-8')
            req = urllib.request.Request(url, data=data, headers=headers, method=method)
            with urllib.request.urlopen(req) as resp:
                return json.load(resp)

        def get_pool_id():
            q = urllib.parse.urlencode({'poolName': pool_name, 'api-version': '7.0'})
            response = http_request(f'/_apis/distributedtask/pools?{q}')
            pools = response.get('value', [])
            if not pools:
                print(f'No pool found with name: {pool_name}', file=sys.stderr)
                sys.exit(1)
            return pools[0]['id']

        def get_online_agents(pool_id):
            q = urllib.parse.urlencode({'api-version': '7.0'})
            response = http_request(f'/_apis/distributedtask/pools/{pool_id}/agents?{q}')
            agents = response.get('value', [])
            return [a for a in agents if a.get('status') == 'online' and a.get('enabled', True)]

        def active_bootstrap_run_exists():
            q = urllib.parse.urlencode({'statusFilter': 'inProgress', 'api-version': '7.1-preview.1'})
            response = http_request(f'/_apis/pipelines/{pipeline_id}/runs?{q}')
            return bool(response.get('value', []))

        pool_id = get_pool_id()
        online = get_online_agents(pool_id)
        if online:
            print(f'Self-hosted pool "{pool_name}" already has {len(online)} online agent(s).')
            sys.exit(0)

        if active_bootstrap_run_exists():
            print('A self-hosted bootstrap pipeline run is already in progress; waiting for the agent to come online.')
        else:
            print('No online self-hosted agent found; queueing bootstrap pipeline.')
            body = {'resources': {'repositories': {'self': {'refName': 'refs/heads/main'}}}}
            response = http_request(f'/_apis/pipelines/{pipeline_id}/runs?api-version=7.1-preview.1', method='POST', body=body)
            print('Queued bootstrap pipeline run id:', response.get('id'))

        deadline = time.time() + wait_seconds
        while time.time() < deadline:
            online = get_online_agents(pool_id)
            if online:
                print(f'Self-hosted agent is online after waiting {int(time.time() + 0 - (deadline - wait_seconds))} seconds.')
                sys.exit(0)
            print(f'No agent online yet; sleeping {interval}s...')
            time.sleep(interval)

        print(f'Timed out waiting for a self-hosted agent in pool "{pool_name}" after {wait_seconds} seconds.', file=sys.stderr)
        sys.exit(1)
        PY
      displayName: 'Check self-hosted pool and queue bootstrap if needed'
      env:
        SELF_HOSTED_POOL: $(selfHostedPool)
        SELF_HOSTED_BOOTSTRAP_PIPELINE_ID: '971'
        SELF_HOSTED_AGENT_WAIT_SECONDS: '900'
        SELF_HOSTED_AGENT_POLL_INTERVAL: '30'
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)

- stage: BootstrapRemoteVm
  displayName: 'Bootstrap remote VM'
  dependsOn: EnsureSelfHostedAgent
  condition: and(eq(${{ parameters.bootstrapRemoteVm }}, true), ne('${{ parameters.infrastructure }}', 'none'))
  jobs:
  - job: Bootstrap
    displayName: 'Bootstrap remote VM'
    pool:
      ${{ if eq(parameters.useHostedAgent, true) }}:
        vmImage: ${{ parameters.hostedVmImage }}
      ${{ if ne(parameters.useHostedAgent, true) }}:
        name: ${{ parameters.selfHostedPool }}
    steps:
    - ${{ if eq(parameters.infrastructure, 'dev-vm') }}:
      - download: devVm
        artifact: dev-vm-trigger
    - ${{ if eq(parameters.infrastructure, 'full-infra') }}:
      - download: fullInfra
        artifact: portal-trigger

    - ${{ if eq(parameters.infrastructure, 'dev-vm') }}:
      - script: |
          TARGET_HOST=$(cat "$(Pipeline.Workspace)/devVm/dev-vm-trigger/vm_ip.txt")
          echo "##vso[task.setvariable variable=TARGET_HOST]$TARGET_HOST"
        displayName: 'Load TARGET_HOST from dev-vm artifact'
    - ${{ if eq(parameters.infrastructure, 'full-infra') }}:
      - script: |
          TARGET_HOST=$(cat "$(Pipeline.Workspace)/fullInfra/portal-trigger/vm_ip.txt")
          echo "##vso[task.setvariable variable=TARGET_HOST]$TARGET_HOST"
        displayName: 'Load TARGET_HOST from full-infra artifact'

    - task: DownloadSecureFile@1
      name: sshKey
      inputs:
        secureFile: 'portal_ssh_key'

    - script: |
        chmod 600 "$(sshKey.secureFilePath)"
        ssh -o StrictHostKeyChecking=no -i "$(sshKey.secureFilePath)" -p "${TARGET_SSH_PORT}" "${TARGET_SSH_USER}@${TARGET_HOST}" <<'EOF'
          set -e
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg lsb-release git python3 python3-pip python3-venv apt-transport-https software-properties-common

          if ! command -v docker >/dev/null 2>&1; then
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
            echo "deb [arch=$$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $$(lsb_release -cs) stable" |
              sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io
            sudo usermod -aG docker "${TARGET_SSH_USER}"
          fi

          if ! command -v docker compose >/dev/null 2>&1; then
            sudo apt-get install -y docker-compose-plugin
          fi

          if ! command -v az >/dev/null 2>&1; then
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          fi

          if ! command -v conda >/dev/null 2>&1; then
            curl -fsSL https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -o /tmp/miniconda.sh
            bash /tmp/miniconda.sh -b -p "/home/${TARGET_SSH_USER}/miniconda"
            rm /tmp/miniconda.sh
            echo 'export PATH="/home/${TARGET_SSH_USER}/miniconda/bin:$PATH"' >> "/home/${TARGET_SSH_USER}/.bashrc"
            export PATH="/home/${TARGET_SSH_USER}/miniconda/bin:$PATH"
            /home/${TARGET_SSH_USER}/miniconda/bin/conda init bash || true
            /home/${TARGET_SSH_USER}/miniconda/bin/conda config --set always_yes yes --set changeps1 no
            /home/${TARGET_SSH_USER}/miniconda/bin/conda install -q mamba -n base
          fi
        EOF
      displayName: 'Bootstrap remote VM with Docker, Docker Compose, Git, Python, Conda, and Azure CLI'

- stage: DeployPortal
  displayName: 'Deploy portal'
  dependsOn: BootstrapRemoteVm
  condition: succeeded()
  jobs:
  - job: Deploy
    displayName: 'Deploy portal'
    pool:
      ${{ if eq(parameters.useHostedAgent, true) }}:
        vmImage: ${{ parameters.hostedVmImage }}
      ${{ if ne(parameters.useHostedAgent, true) }}:
        name: ${{ parameters.selfHostedPool }}
    steps:
    - task: DownloadSecureFile@1
      name: tlsCert
      inputs:
        secureFile: 'cloud-nuage.crt'

    - task: DownloadSecureFile@1
      name: tlsKey
      inputs:
        secureFile: 'cloud-nuage.key'

    - task: DownloadSecureFile@1
      name: tlsChain
      inputs:
        secureFile: 'cloud-nuage-chain.pem'

    - task: DownloadSecureFile@1
      name: rootCA
      inputs:
        secureFile: 'GoC-GdC-Root-A.crt'

    - script: |
        cp "$(rootCA.secureFilePath)" "$(Build.SourcesDirectory)/redmine/GoC-GdC-Root-A.crt"
        cp "$(rootCA.secureFilePath)" "$(Build.SourcesDirectory)/GoC-GdC-Root-A.crt"
      displayName: Copy root CA into Docker build contexts

    - script: |
        sudo mkdir -p /etc/foodport/tls
        sudo cp "$(tlsCert.secureFilePath)" /etc/foodport/tls/cloud-nuage.crt
        sudo cp "$(tlsKey.secureFilePath)" /etc/foodport/tls/cloud-nuage.key
        sudo cp "$(tlsChain.secureFilePath)" /etc/foodport/tls/cloud-nuage-chain.pem
        sudo cp "$(rootCA.secureFilePath)" /etc/foodport/tls/GoC-GdC-Root-A.crt
        sudo chmod 644 /etc/foodport/tls/cloud-nuage.crt
        sudo chmod 600 /etc/foodport/tls/cloud-nuage.key
        sudo chmod 644 /etc/foodport/tls/cloud-nuage-chain.pem
        sudo chmod 644 /etc/foodport/tls/GoC-GdC-Root-A.crt
      displayName: 'Install TLS certificates'

    - task: AzureKeyVault@2
      inputs:
        azureSubscription: 'CFDC-FoodPort-service-connection'
        KeyVaultName: 'FoodPort-key-vault'
        SecretsFilter: 'secret-key-base,redmine-database-password,azure-account-name,azure-account-key,batch-account-name,batch-account-url,batch-account-key,batch-account-subnet,vm-image,cowbat-node-agent-sku,ampliseq-image,ampliseq-node-agent-sku,cowsnphr-image,cowsnphr-node-agent-sku,vm-client-id,vm-secret,vm-tenant,ad-app-id,ad-app-secret-id,ad-app-secret,entra-id-client-id,entra-id-client-secret,entra-id-tenant-id,redmine-default-from,email-host-user,email-host-password,email-relay-secret,db-name,db-user,db-pass,db-service,db-port,django-email-backend,sentry-dsn,environment,connection-string,flower-user,flower-password,site-url,django-server-name,redmine-server-name,api-key,dev-api-key'

    - script: |
        python3 <<'PY'
        import os
        import os.path
        path = os.path.join(os.environ['BUILD_SOURCESDIRECTORY'], 'env')
        keys = [
          'SECRET_KEY',
          'SECRET_KEY_BASE',
          'AZURE_ACCOUNT_NAME',
          'AZURE_ACCOUNT_KEY',
          'BATCH_ACCOUNT_NAME',
          'BATCH_ACCOUNT_URL',
          'BATCH_ACCOUNT_KEY',
          'BATCH_ACCOUNT_SUBNET',
          'VM_IMAGE',
          'COWBAT_NODE_AGENT_SKU',
          'AMPLISEQ_IMAGE',
          'AMPLISEQ_NODE_AGENT_SKU',
          'COWSNPHR_IMAGE',
          'COWSNPHR_NODE_AGENT_SKU',
          'VM_CLIENT_ID',
          'VM_SECRET',
          'VM_TENANT',
          'AD_APP_ID',
          'AD_APP_SECRET_ID',
          'AD_APP_SECRET',
          'ENTRA_ID_CLIENT_ID',
          'ENTRA_ID_CLIENT_SECRET',
          'ENTRA_ID_TENANT_ID',
          'REDMINE_DEFAULT_FROM',
          'EMAIL_HOST_USER',
          'EMAIL_HOST_PASSWORD',
          'EMAIL_RELAY_SECRET',
          'API_KEY',
          'DEV_API_KEY',
          'DJANGO_SERVER_NAME',
          'REDMINE_SERVER_NAME',
          'DB_NAME',
          'DB_USER',
          'DB_PASS',
          'DB_SERVICE',
          'DB_PORT',
          'DJANGO_EMAIL_BACKEND',
          'SENTRY_DSN',
          'ENVIRONMENT',
          'CONNECTION_STRING',
          'FLOWER_USER',
          'FLOWER_PASSWORD',
          'SITE_URL',
          'BUILD_SOURCESDIRECTORY',
          'REDMINE_DB_PASSWORD',
          'MYSQL_ROOT_PASSWORD',
          'MYSQL_PASSWORD',
        ]
        with open(path, 'w', encoding='utf-8') as f:
            for key in keys:
                if key in os.environ:
                    f.write(f"{key}={os.environ[key]}\n")
                    continue

                dashed_key = key.lower().replace('_', '-')
                if dashed_key in os.environ:
                    f.write(f"{key}={os.environ[dashed_key]}\n")
        PY
        chmod 600 "${BUILD_SOURCESDIRECTORY}/env"
      displayName: 'Write env file from Key Vault variables'

    - ${{ if eq(parameters.infrastructure, 'dev-vm') }}:
      - download: devVm
        artifact: dev-vm-trigger
    - ${{ if eq(parameters.infrastructure, 'full-infra') }}:
      - download: fullInfra
        artifact: portal-trigger

    - ${{ if eq(parameters.infrastructure, 'dev-vm') }}:
      - script: |
          set -e
          VM_IP=$(cat "$(Pipeline.Workspace)/devVm/dev-vm-trigger/vm_ip.txt")
          ENV_FILE="${BUILD_SOURCESDIRECTORY}/env"
          if grep -q '^DJANGO_ALLOWED_HOSTS=' "$ENV_FILE"; then
            sed -i "s|^DJANGO_ALLOWED_HOSTS=.*|DJANGO_ALLOWED_HOSTS=0.0.0.0,localhost,127.0.0.1,$VM_IP|" "$ENV_FILE"
          else
            echo "DJANGO_ALLOWED_HOSTS=0.0.0.0,localhost,127.0.0.1,$VM_IP" >> "$ENV_FILE"
          fi
        displayName: 'Set portal VM IP in env file from dev-vm artifact'
    - ${{ if eq(parameters.infrastructure, 'full-infra') }}:
      - script: |
          set -e
          VM_IP=$(cat "$(Pipeline.Workspace)/fullInfra/portal-trigger/vm_ip.txt")
          ENV_FILE="${BUILD_SOURCESDIRECTORY}/env"
          if grep -q '^DJANGO_ALLOWED_HOSTS=' "$ENV_FILE"; then
            sed -i "s|^DJANGO_ALLOWED_HOSTS=.*|DJANGO_ALLOWED_HOSTS=0.0.0.0,localhost,127.0.0.1,$VM_IP|" "$ENV_FILE"
          else
            echo "DJANGO_ALLOWED_HOSTS=0.0.0.0,localhost,127.0.0.1,$VM_IP" >> "$ENV_FILE"
          fi
        displayName: 'Set portal VM IP in env file from full-infra artifact'

    - script: |
        python3 <<'PY'
        import os
        from pathlib import Path

        root = Path(os.environ['BUILD_SOURCESDIRECTORY'])

        secrets_src = root / 'redmine' / 'config' / 'secrets.yml.template'
        secrets_dst = root / 'redmine' / 'config' / 'secrets.yml'

        text = secrets_src.read_text(encoding='utf-8')
        secret_key = os.environ.get('SECRET_KEY_BASE') or os.environ.get('secret-key-base')
        if not secret_key:
            raise SystemExit('Required environment variable SECRET_KEY_BASE / secret-key-base is missing')

        text = text.replace('${SECRET_KEY_BASE}', secret_key)
        secrets_dst.write_text(text, encoding='utf-8')

        db_src = root / 'redmine' / 'config' / 'database.yml.template'
        db_dst = root / 'redmine' / 'config' / 'database.yml'

        db_text = db_src.read_text(encoding='utf-8')
        db_password = os.environ.get('REDMINE_DB_PASSWORD') or os.environ.get('redmine-database-password')
        if not db_password:
            raise SystemExit('Required environment variable REDMINE_DB_PASSWORD / redmine-database-password is missing')

        db_text = db_text.replace('${REDMINE_DB_PASSWORD}', db_password)
        db_dst.write_text(db_text, encoding='utf-8')
        PY
      displayName: 'Render redmine config files from templates'

    - script: |
        python3 <<'PY'
        import os
        from pathlib import Path

        root = Path(os.environ['BUILD_SOURCESDIRECTORY'])
        deploy_env = os.environ.get('DEPLOY_ENVIRONMENT', 'dev').lower()
        if deploy_env not in ('dev', 'prod'):
            raise SystemExit(f'Unsupported DEPLOY_ENVIRONMENT: {deploy_env}')

        django_server_name = os.environ.get('DJANGO_SERVER_NAME')
        if not django_server_name:
            raise SystemExit('Required environment variable DJANGO_SERVER_NAME is missing')

        src = root / 'nginx' / 'sites-enabled' / 'django.template'
        dst = root / 'nginx' / 'sites-enabled' / 'django'
        text = src.read_text(encoding='utf-8')
        text = text.replace('${DJANGO_SERVER_NAME}', django_server_name)
        dst.write_text(text, encoding='utf-8')

        https_dst = root / 'nginx' / 'sites-enabled' / 'django-https'
        if deploy_env == 'prod':
            redmine_server_name = os.environ.get('REDMINE_SERVER_NAME')
            if not redmine_server_name:
                raise SystemExit('Required environment variable REDMINE_SERVER_NAME is missing')
            src = root / 'nginx' / 'sites-enabled' / 'django-https.template'
            text = src.read_text(encoding='utf-8')
            text = text.replace('${DJANGO_SERVER_NAME}', django_server_name)
            text = text.replace('${REDMINE_SERVER_NAME}', redmine_server_name)
            https_dst.write_text(text, encoding='utf-8')
        else:
            if https_dst.exists():
                https_dst.unlink()
        PY
      displayName: 'Generate nginx site configs from templates'

    - script: |
        cd "$(Build.SourcesDirectory)"
        sudo rm -f celerybeat-schedule.db celerybeat.pid
        docker compose down
        docker compose up -d
      displayName: 'Restart containers'
