trigger: none
pr: none

resources:
  repositories:
  - repository: foodport-tf
    type: git
    name: FoodPort/foodport-tf
    trigger: none

parameters:
- name: destroy
  type: boolean
  default: false
- name: deployEnvironment
  type: string
  default: dev
  values:
    - dev
    - prod
- name: useHostedAgent
  type: boolean
  default: false
- name: hostedVmImage
  type: string
  default: 'ubuntu-latest'
- name: bootstrapRemoteVm
  type: boolean
  default: true
- name: validateManagedDevOpsPool
  type: boolean
  default: false
- name: azureServiceConnection
  type: string
  default: CFDC-FoodPort-managed-identity
  values:
    - CFDC-FoodPort-managed-identity

variables:
- name: DEPLOY_ENVIRONMENT
  value: ${{ parameters.deployEnvironment }}
- ${{ if eq(parameters.deployEnvironment, 'prod') }}:
  - name: DJANGO_SERVER_NAME
    value: 'foodport-dev.cloud-nuage.inspection.gc.ca'
- ${{ if eq(parameters.deployEnvironment, 'dev') }}:
  - name: DJANGO_SERVER_NAME
    value: '_'
- ${{ if eq(parameters.deployEnvironment, 'prod') }}:
  - name: REDMINE_SERVER_NAME
    value: 'redmine-dev.cloud-nuage.inspection.gc.ca'
- ${{ if eq(parameters.deployEnvironment, 'dev') }}:
  - name: REDMINE_SERVER_NAME
    value: '_'
- name: TARGET_HOST
  value: ''
- name: TARGET_SSH_USER
  value: 'cfiaadmin'
- name: TARGET_SSH_PORT
  value: '22'

stages:
- stage: ValidateManagedDevOpsPool
  displayName: 'Validate Managed DevOps Pool access'
  dependsOn: []
  condition: eq(${{ parameters.validateManagedDevOpsPool }}, true)
  jobs:
  - job: ValidatePool
    displayName: Validate private Terraform state access
    pool:
      name: CFDC-FoodPort-MDP-pool
    steps:
    - checkout: foodport-tf
      path: foodport-tf

    - task: DownloadSecureFile@1
      name: agentRootCA
      inputs:
        secureFile: 'GoC-GdC-Root-A.crt'

    - script: |
        set -euo pipefail
        if ! command -v update-ca-certificates >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates
        fi
        sudo install -D -m 0644 "$(agentRootCA.secureFilePath)" /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt
        sudo update-ca-certificates
        if ! command -v curl >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl unzip
        fi
        if ! command -v az >/dev/null 2>&1; then
          installer="$(mktemp)"
          trap 'rm -f -- "$installer"' EXIT
          curl --fail --show-error --location --retry 3 --retry-all-errors --output "$installer" https://aka.ms/InstallAzureCLIDeb
          sudo bash "$installer"
        fi
        az version
      displayName: Ensure Azure CLI is installed
      env:
        CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt

    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@0
      displayName: Install Terraform
      env:
        NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt
      inputs:
        terraformVersion: '1.9.8'

    - task: AzureCLI@2
      displayName: Validate private Terraform state access
      env:
        CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt
      inputs:
        azureSubscription: ${{ parameters.azureServiceConnection }}
        addSpnToEnvironment: true
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          if [ -z "${idToken:-}" ] || [ -z "${servicePrincipalId:-}" ] || [ -z "${tenantId:-}" ]; then
            echo "ERROR: AzureCLI did not expose workload identity federation credentials." >&2
            exit 1
          fi

          export ARM_USE_OIDC=true
          export ARM_OIDC_TOKEN="${idToken}"
          export ARM_CLIENT_ID="${servicePrincipalId}"
          export ARM_TENANT_ID="${tenantId}"
          export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

          cd "$(Pipeline.Workspace)/foodport-tf/full-infra"
          terraform init -input=false -lockfile=readonly

- stage: ProvisionFullInfra
  displayName: 'Provision full infrastructure'
  dependsOn: []
  condition: and(succeeded(), ne(${{ parameters.validateManagedDevOpsPool }}, true))
  jobs:
  - job: Terraform
    displayName: Full Infra Terraform
    pool:
      ${{ if eq(parameters.useHostedAgent, true) }}:
        vmImage: ${{ parameters.hostedVmImage }}
      ${{ if ne(parameters.useHostedAgent, true) }}:
        name: CFDC-FoodPort-MDP-pool
    steps:
    - checkout: self
      persistCredentials: true
    - checkout: foodport-tf
      path: foodport-tf
      persistCredentials: true

    - task: DownloadSecureFile@1
      name: agentRootCA
      inputs:
        secureFile: 'GoC-GdC-Root-A.crt'

    - script: |
        set -euo pipefail
        if ! command -v update-ca-certificates >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates
        fi
        sudo install -D -m 0644 "$(agentRootCA.secureFilePath)" /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt
        sudo update-ca-certificates
        if ! command -v curl >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl unzip
        fi
        if ! command -v az >/dev/null 2>&1; then
          installer="$(mktemp)"
          trap 'rm -f -- "$installer"' EXIT
          curl --fail --show-error --location --retry 3 --retry-all-errors --output "$installer" https://aka.ms/InstallAzureCLIDeb
          sudo bash "$installer"
        fi
        az version
      displayName: Ensure Azure CLI is installed
      env:
        CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt

    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@0
      displayName: Install Terraform
      env:
        NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt
      inputs:
        terraformVersion: '1.9.8'

    - task: UsePythonVersion@0
      env:
        NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt
      inputs:
        versionSpec: '3.x'

    - ${{ if not(parameters.destroy) }}:
      - task: AzureCLI@2
        displayName: Apply Terraform for full infra
        env:
          SSH_PUBLIC_KEY: $(sshPublicKey)
          CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
          NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt
        inputs:
          azureSubscription: ${{ parameters.azureServiceConnection }}
          addSpnToEnvironment: true
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            if [ -z "${idToken:-}" ] || [ -z "${servicePrincipalId:-}" ] || [ -z "${tenantId:-}" ]; then
              echo "ERROR: AzureCLI did not expose the workload identity federation credentials required by Terraform." >&2
              exit 1
            fi
            export ARM_USE_OIDC=true
            export ARM_OIDC_TOKEN="${idToken}"
            export ARM_CLIENT_ID="${servicePrincipalId}"
            export ARM_TENANT_ID="${tenantId}"
            export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

            cd "$(Pipeline.Workspace)/foodport-tf/full-infra"
            if [ -z "${SSH_PUBLIC_KEY:-}" ]; then
              echo "ERROR: sshPublicKey pipeline variable is not defined or is empty."
              exit 1
            fi
            export TF_VAR_ssh_public_key="${SSH_PUBLIC_KEY}"
            terraform init -input=false
            terraform plan -input=false -out=tfplan
            terraform apply -input=false -auto-approve tfplan

            VM_IP="$(terraform output -raw portal_vm_private_ip)"
            echo "$VM_IP" > vm_ip.txt

      - task: PublishPipelineArtifact@1
        displayName: Publish portal VM IP artifact
        inputs:
          targetPath: '$(Pipeline.Workspace)/foodport-tf/full-infra/vm_ip.txt'
          artifact: 'fullInfra'

    - ${{ if parameters.destroy }}:
      - task: AzureCLI@2
        displayName: Destroy Terraform-managed full infra
        env:
          SSH_PUBLIC_KEY: $(sshPublicKey)
          CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
          NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt
        inputs:
          azureSubscription: ${{ parameters.azureServiceConnection }}
          addSpnToEnvironment: true
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            if [ -z "${idToken:-}" ] || [ -z "${servicePrincipalId:-}" ] || [ -z "${tenantId:-}" ]; then
              echo "ERROR: AzureCLI did not expose the workload identity federation credentials required by Terraform." >&2
              exit 1
            fi
            export ARM_USE_OIDC=true
            export ARM_OIDC_TOKEN="${idToken}"
            export ARM_CLIENT_ID="${servicePrincipalId}"
            export ARM_TENANT_ID="${tenantId}"
            export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

            cd "$(Pipeline.Workspace)/foodport-tf/full-infra"
            if [ -z "${SSH_PUBLIC_KEY:-}" ]; then
              echo "ERROR: sshPublicKey pipeline variable is not defined or is empty."
              exit 1
            fi
            export TF_VAR_ssh_public_key="${SSH_PUBLIC_KEY}"
            terraform init -input=false
            terraform destroy -input=false -auto-approve

- stage: BootstrapRemoteVm
  displayName: 'Bootstrap remote VM'
  condition: and(succeeded(), eq(${{ parameters.bootstrapRemoteVm }}, true), ne(${{ parameters.destroy }}, true), ne(${{ parameters.validateManagedDevOpsPool }}, true))
  dependsOn:
    - ProvisionFullInfra
  jobs:
  - job: Bootstrap
    displayName: 'Bootstrap remote VM'
    pool:
      ${{ if eq(parameters.useHostedAgent, true) }}:
        vmImage: ${{ parameters.hostedVmImage }}
      ${{ if ne(parameters.useHostedAgent, true) }}:
        name: CFDC-FoodPort-MDP-pool
    steps:
    - task: DownloadSecureFile@1
      name: rootCA
      inputs:
        secureFile: 'GoC-GdC-Root-A.crt'

    - script: |
        set -euo pipefail
        if ! command -v update-ca-certificates >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates
        fi
        sudo install -D -m 0644 "$(rootCA.secureFilePath)" /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt
        sudo update-ca-certificates
      displayName: Trust GoC root CA before artifact download

    - task: DownloadPipelineArtifact@2
      displayName: 'Download full infra artifact'
      inputs:
        artifact: 'fullInfra'
        path: '$(Pipeline.Workspace)'

    - script: |
        set -euo pipefail

        ARTIFACT_DIR="$(Pipeline.Workspace)"
        echo "Listing downloaded artifact contents: ${artifact_dir}"
        find "${artifact_dir}" -maxdepth 6 -type f | sort

        artifact_file=$(find "${artifact_dir}" -type f -name 'vm_ip.txt' | head -n 1 || true)
        if [ -z "${artifact_file:-}" ]; then
          echo "ERROR: full infra artifact file vm_ip.txt not found under ${artifact_dir}"
          exit 1
        fi

        TARGET_HOST=$(cat "${artifact_file}")
        if [ -z "${TARGET_HOST:-}" ]; then
          echo "ERROR: full infra artifact file is empty: ${artifact_file}"
          exit 1
        fi

        echo "Found vm_ip.txt at: ${artifact_file}"
        echo "##vso[task.setvariable variable=TARGET_HOST]$TARGET_HOST"
      displayName: 'Load TARGET_HOST from full infra artifact'

    - task: DownloadSecureFile@1
      name: tlsCert
      inputs:
        secureFile: 'cloud-nuage.crt'

    - task: DownloadSecureFile@1
      name: tlsKey
      inputs:
        secureFile: 'cloud-nuage.key'

    - task: DownloadSecureFile@1
      name: tlsChain
      inputs:
        secureFile: 'cloud-nuage-chain.pem'

    - task: DownloadSecureFile@1
      name: sshKey
      inputs:
        secureFile: 'portal_ssh_key'

    - script: |
        set -euo pipefail
        chmod 600 "$(sshKey.secureFilePath)"
        REMOTE_DIR="/home/${TARGET_SSH_USER}/FoodPort/olc_genomics_portal"
        scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$(sshKey.secureFilePath)" -P "${TARGET_SSH_PORT}" "$(rootCA.secureFilePath)" "${TARGET_SSH_USER}@${TARGET_HOST}:/tmp/GoC-GdC-Root-A.crt"
        scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$(sshKey.secureFilePath)" -P "${TARGET_SSH_PORT}" "$(tlsCert.secureFilePath)" "${TARGET_SSH_USER}@${TARGET_HOST}:/tmp/cloud-nuage.crt"
        scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$(sshKey.secureFilePath)" -P "${TARGET_SSH_PORT}" "$(tlsKey.secureFilePath)" "${TARGET_SSH_USER}@${TARGET_HOST}:/tmp/cloud-nuage.key"
        scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$(sshKey.secureFilePath)" -P "${TARGET_SSH_PORT}" "$(tlsChain.secureFilePath)" "${TARGET_SSH_USER}@${TARGET_HOST}:/tmp/cloud-nuage-chain.pem"
        scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$(sshKey.secureFilePath)" -P "${TARGET_SSH_PORT}" "$(sshKey.secureFilePath)" "${TARGET_SSH_USER}@${TARGET_HOST}:/tmp/portal_ssh_key"
        scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$(sshKey.secureFilePath)" -P "${TARGET_SSH_PORT}" "$(Build.SourcesDirectory)/ci/github_ssh_config" "${TARGET_SSH_USER}@${TARGET_HOST}:/tmp/github_ssh_config"
        if [ -n "${SSH_PUBLIC_KEY:-}" ]; then
          derived_pub=$(ssh-keygen -y -f "$(sshKey.secureFilePath)" 2>/tmp/sshkeygen.err || true)
          if [ -z "$derived_pub" ]; then
            echo "WARNING: failed to derive public key from private key file; skipping public-key matching check."
            echo "ssh-keygen details:"
            sed 's/^/  /' /tmp/sshkeygen.err || true
          elif [ "$derived_pub" != "$SSH_PUBLIC_KEY" ]; then
            echo "ERROR: the private key in secure file does not match sshPublicKey"
            echo "Please provide the matching private key for the public key used by Terraform."
            exit 1
          fi
          rm -f /tmp/sshkeygen.err
        fi
        ssh -o StrictHostKeyChecking=no -i "$(sshKey.secureFilePath)" -p "${TARGET_SSH_PORT}" "${TARGET_SSH_USER}@${TARGET_HOST}" <<EOF
          set -e
          sudo cp /tmp/GoC-GdC-Root-A.crt /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt
          sudo chmod 644 /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt
          sudo update-ca-certificates
          sudo mkdir -p /etc/foodport/tls
          sudo cp /tmp/cloud-nuage.crt /etc/foodport/tls/cloud-nuage.crt
          sudo cp /tmp/cloud-nuage.key /etc/foodport/tls/cloud-nuage.key
          sudo cp /tmp/cloud-nuage-chain.pem /etc/foodport/tls/cloud-nuage-chain.pem
          sudo chmod 644 /etc/foodport/tls/cloud-nuage.crt
          sudo chmod 600 /etc/foodport/tls/cloud-nuage.key
          sudo chmod 644 /etc/foodport/tls/cloud-nuage-chain.pem
          sudo mkdir -p "/home/${TARGET_SSH_USER}/.ssh"
          sudo chown "${TARGET_SSH_USER}:${TARGET_SSH_USER}" "/home/${TARGET_SSH_USER}/.ssh"
          sudo chmod 700 "/home/${TARGET_SSH_USER}/.ssh"
          sudo mv /tmp/portal_ssh_key "/home/${TARGET_SSH_USER}/.ssh/portal_ssh_key"
          sudo chmod 600 "/home/${TARGET_SSH_USER}/.ssh/portal_ssh_key"
          sudo chown "${TARGET_SSH_USER}:${TARGET_SSH_USER}" "/home/${TARGET_SSH_USER}/.ssh/portal_ssh_key"
          sudo cp /tmp/github_ssh_config "/home/${TARGET_SSH_USER}/.ssh/config"
          sudo chmod 600 "/home/${TARGET_SSH_USER}/.ssh/config"
          sudo chown "${TARGET_SSH_USER}:${TARGET_SSH_USER}" "/home/${TARGET_SSH_USER}/.ssh/config"
          sudo -u "${TARGET_SSH_USER}" ssh-keyscan github.com >> "/home/${TARGET_SSH_USER}/.ssh/known_hosts"
          sudo chmod 644 "/home/${TARGET_SSH_USER}/.ssh/known_hosts"
          sudo chown "${TARGET_SSH_USER}:${TARGET_SSH_USER}" "/home/${TARGET_SSH_USER}/.ssh/known_hosts"
          sudo -u "${TARGET_SSH_USER}" git config --global user.name "adamkoziol"
          sudo -u "${TARGET_SSH_USER}" git config --global user.email "adam.koziol@inspection.gc.ca"
          if [ -d "$REMOTE_DIR/.git" ]; then
            sudo -u "${TARGET_SSH_USER}" git -C "$REMOTE_DIR" remote set-url origin git@github.com:OLC-Bioinformatics/olc_genomics_portal.git || true
          fi
          sudo rm -f /etc/apt/sources.list.d/docker.list
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg lsb-release git python3 python3-pip python3-venv apt-transport-https software-properties-common

          if ! command -v docker >/dev/null 2>&1; then
            echo "DEBUG: docker not installed, entering docker bootstrap block"
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --batch --yes --no-tty --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
            sudo mkdir -p /etc/apt/sources.list.d
            arch="\$(dpkg --print-architecture)"
            codename="\$(lsb_release -cs)"
            ts="\$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sudo rm -f /etc/apt/sources.list.d/docker.list
            sudo bash -lc "printf '### generated: %s\n' \"\$ts\" > /etc/apt/sources.list.d/docker.list"
            sudo bash -lc "printf 'deb [arch=%s signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu %s stable\n' \"\$arch\" \"\$codename\" >> /etc/apt/sources.list.d/docker.list"
            sudo ls -l /etc/apt/sources.list.d/docker.list
            sudo cat /etc/apt/sources.list.d/docker.list
            sudo DEBIAN_FRONTEND=noninteractive apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io || true

            if ! command -v docker >/dev/null 2>&1; then
              echo 'WARNING: docker-ce install failed, trying ubuntu docker.io fallback'
              sudo DEBIAN_FRONTEND=noninteractive apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io || true
            fi

            if ! command -v docker >/dev/null 2>&1; then
              echo 'WARNING: docker.io fallback failed, trying get.docker.com convenience script'
              curl -fsSL https://get.docker.com | sudo sh || true
            fi

            if ! command -v docker >/dev/null 2>&1; then
              echo 'ERROR: Docker CLI is still unavailable after primary and fallback installs.'
              echo 'DEBUG: apt-cache policy docker-ce docker-ce-cli containerd.io docker.io'
              sudo apt-cache policy docker-ce docker-ce-cli containerd.io docker.io || true
              exit 1
            fi
            sudo usermod -aG docker "${TARGET_SSH_USER}"
          fi

          if ! docker compose version >/dev/null 2>&1; then
            sudo apt-get install -y docker-compose-plugin
          fi

          if ! command -v docker >/dev/null 2>&1; then
            echo 'ERROR: Docker CLI is not available after installation.'
            exit 1
          fi
          if ! docker compose version >/dev/null 2>&1; then
            echo 'ERROR: Docker Compose is not available after installation.'
            echo 'DEBUG: docker --version:'
            docker --version || true
            echo 'DEBUG: docker compose version:'
            docker compose version || true
            exit 1
          fi

          if ! command -v az >/dev/null 2>&1; then
            installer="\$(mktemp)"
            trap 'rm -f -- "\$installer"' EXIT
            curl --fail --show-error --location --retry 3 --retry-all-errors --output "\$installer" https://aka.ms/InstallAzureCLIDeb
            sudo bash "\$installer"
          fi

          if [ ! -x "/home/${TARGET_SSH_USER}/miniconda/bin/conda" ]; then
            curl -fsSL https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -o /tmp/miniconda.sh
            bash /tmp/miniconda.sh -b -p "/home/${TARGET_SSH_USER}/miniconda"
            rm /tmp/miniconda.sh
          else
            echo "Conda already installed at /home/${TARGET_SSH_USER}/miniconda"
          fi
          if ! grep -qxF "export PATH=\"/home/${TARGET_SSH_USER}/miniconda/bin:\$PATH\"" "/home/${TARGET_SSH_USER}/.bashrc"; then
            echo "export PATH=\"/home/${TARGET_SSH_USER}/miniconda/bin:\$PATH\"" >> "/home/${TARGET_SSH_USER}/.bashrc"
          fi
          export PATH="/home/${TARGET_SSH_USER}/miniconda/bin:$PATH"
          /home/${TARGET_SSH_USER}/miniconda/bin/conda init bash || true
          /home/${TARGET_SSH_USER}/miniconda/bin/conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main
          /home/${TARGET_SSH_USER}/miniconda/bin/conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/r
          CONDA_NO_PLUGINS=true /home/${TARGET_SSH_USER}/miniconda/bin/conda config --set always_yes yes --set changeps1 no
          export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
          export REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
          CONDA_NO_PLUGINS=true /home/${TARGET_SSH_USER}/miniconda/bin/conda config --set ssl_verify /etc/ssl/certs/ca-certificates.crt
          CONDA_NO_PLUGINS=true /home/${TARGET_SSH_USER}/miniconda/bin/conda config --prepend channels conda-forge
          CONDA_NO_PLUGINS=true /home/${TARGET_SSH_USER}/miniconda/bin/conda config --prepend channels bioconda
          CONDA_NO_PLUGINS=true /home/${TARGET_SSH_USER}/miniconda/bin/conda config --prepend channels olcbioinformatics
          CONDA_NO_PLUGINS=true /home/${TARGET_SSH_USER}/miniconda/bin/conda config --set solver classic
          CONDA_NO_PLUGINS=true /home/${TARGET_SSH_USER}/miniconda/bin/conda install -q --solver=classic mamba -n base
        EOF
      env:
        SSH_PUBLIC_KEY: $(sshPublicKey)
      displayName: 'Bootstrap remote VM with Docker, Docker Compose, Git, Python, Conda, and Azure CLI'


- stage: DeployPortal
  displayName: 'Deploy portal'
  dependsOn: BootstrapRemoteVm
  condition: and(succeeded(), ne(${{ parameters.validateManagedDevOpsPool }}, true))
  jobs:
  - job: Deploy
    displayName: 'Deploy portal'
    pool:
      ${{ if eq(parameters.useHostedAgent, true) }}:
        vmImage: ${{ parameters.hostedVmImage }}
      ${{ if ne(parameters.useHostedAgent, true) }}:
        name: CFDC-FoodPort-MDP-pool
    steps:
    - task: DownloadSecureFile@1
      name: rootCA
      inputs:
        secureFile: 'GoC-GdC-Root-A.crt'

    - script: |
        set -euo pipefail
        if ! command -v update-ca-certificates >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates
        fi
        sudo install -D -m 0644 "$(rootCA.secureFilePath)" /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt
        sudo update-ca-certificates
      displayName: Trust GoC root CA before artifact download

    - script: |
        cp "$(rootCA.secureFilePath)" "$(Build.SourcesDirectory)/redmine/GoC-GdC-Root-A.crt"
        cp "$(rootCA.secureFilePath)" "$(Build.SourcesDirectory)/rag/GoC-GdC-Root-A.crt"
        cp "$(rootCA.secureFilePath)" "$(Build.SourcesDirectory)/GoC-GdC-Root-A.crt"
      displayName: Copy root CA into Docker build contexts

    - script: |
        echo 'Skipping local Key Vault fetch and env validation; this will happen on the target VM.'
      displayName: 'Skip local Key Vault fetch/validation'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download full infra artifact for deploy'
      inputs:
        artifact: 'fullInfra'
        path: '$(Pipeline.Workspace)'

    - script: |
        set -e
        ARTIFACT_DIR="$(Pipeline.Workspace)/fullInfra"
        VM_IP_FILE=$(find "$ARTIFACT_DIR" -type f -name 'vm_ip.txt' | head -n 1 || true)
        if [ -z "${VM_IP_FILE:-}" ]; then
          echo "ERROR: vm_ip.txt not found under $ARTIFACT_DIR"
          find "$ARTIFACT_DIR" -maxdepth 6 -type f | sort
          exit 1
        fi
        VM_IP=$(cat "$VM_IP_FILE")
        echo "##vso[task.setvariable variable=TARGET_HOST]$VM_IP"
      displayName: 'Set target VM IP variable'

    - task: DownloadSecureFile@1
      name: sshKey
      inputs:
        secureFile: 'portal_ssh_key'

    - script: |
        set -euo pipefail
        chmod 600 "$(sshKey.secureFilePath)"
        REMOTE_DIR="/home/${TARGET_SSH_USER}/FoodPort/olc_genomics_portal"

        echo "Copying portal source tree to ${TARGET_HOST}:${REMOTE_DIR}"
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$(sshKey.secureFilePath)" -p "${TARGET_SSH_PORT}" "${TARGET_SSH_USER}@${TARGET_HOST}" "sudo rm -rf '$REMOTE_DIR' && sudo mkdir -p '$REMOTE_DIR' && sudo chown ${TARGET_SSH_USER}:${TARGET_SSH_USER} '$REMOTE_DIR'"
        tar -C "$(Build.SourcesDirectory)" -cf - . | ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$(sshKey.secureFilePath)" -p "${TARGET_SSH_PORT}" "${TARGET_SSH_USER}@${TARGET_HOST}" "tar -C '$REMOTE_DIR' -xvf -"
        scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$(sshKey.secureFilePath)" -P "${TARGET_SSH_PORT}" "$(sshKey.secureFilePath)" "${TARGET_SSH_USER}@${TARGET_HOST}:/tmp/portal_ssh_key"

        safe_REMOTE_DIR=$(printf '%q' "$REMOTE_DIR")
        safe_TARGET_HOST=$(printf '%q' "${TARGET_HOST:-}")

        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$(sshKey.secureFilePath)" -p "${TARGET_SSH_PORT}" "${TARGET_SSH_USER}@${TARGET_HOST}" \
          "REMOTE_DIR=$safe_REMOTE_DIR TARGET_HOST=$safe_TARGET_HOST bash -s" <<'EOF'
          set -euo pipefail
          umask 077

          AZURE_CONFIG_DIR="$(mktemp -d "${TMPDIR:-/tmp}/foodport-azure-cli.XXXXXX")"
          export AZURE_CONFIG_DIR
          trap 'rm -rf -- "$AZURE_CONFIG_DIR"' EXIT
          mkdir -p "$AZURE_CONFIG_DIR"
          az login --identity --allow-no-subscriptions --output none

          vault='FoodPort-key-vault'
          env_file="$REMOTE_DIR/env"
          dotenv_file="$REMOTE_DIR/.env"
          : > "$env_file"
          : > "$dotenv_file"
          printf '%s=%s\n' MICROSOFT_AUTH_ENABLED False >> "$env_file"
          printf '%s=%s\n' MICROSOFT_AUTH_ENABLED False >> "$dotenv_file"
          django_allowed_hosts="0.0.0.0,localhost,127.0.0.1,$TARGET_HOST"
          printf '%s=%s\n' DJANGO_ALLOWED_HOSTS "$django_allowed_hosts" >> "$env_file"
          printf '%s=%s\n' DJANGO_ALLOWED_HOSTS "$django_allowed_hosts" >> "$dotenv_file"

          secrets=(
            secret-key
            secret-key-base
            redmine-database-password
            azure-account-name
            azure-account-key
            batch-account-name
            batch-account-url
            batch-account-key
            batch-account-subnet
            vm-image
            cowbat-node-agent-sku
            ampliseq-image
            ampliseq-node-agent-sku
            cowsnphr-image
            cowsnphr-node-agent-sku
            ad-app-id
            ad-app-secret-id
            ad-app-secret
            entra-id-client-id
            entra-id-client-secret
            entra-id-tenant-id
            redmine-default-from
            email-host-user
            email-host-password
            email-relay-secret
            db-name
            db-user
            db-pass
            db-service
            db-port
            django-email-backend
            sentry-dsn
            environment
            connection-string
            site-url
            django-server-name
            redmine-server-name
            api-key
            dev-api-key
            maria-db-root-password
            mysql-password
            subscription-id
            tenant-id
            client-id
            client-secret
            resource-group-name
            storage-account-name
          )
          for secret in "${secrets[@]}"; do
            case "$secret" in
              secret-key) var_name='SECRET_KEY' ;;
              secret-key-base) var_name='SECRET_KEY_BASE' ;;
              redmine-database-password) var_name='REDMINE_DB_PASSWORD' ;;
              azure-account-name) var_name='AZURE_ACCOUNT_NAME' ;;
              azure-account-key) var_name='AZURE_ACCOUNT_KEY' ;;
              batch-account-name) var_name='BATCH_ACCOUNT_NAME' ;;
              batch-account-url) var_name='BATCH_ACCOUNT_URL' ;;
              batch-account-key) var_name='BATCH_ACCOUNT_KEY' ;;
              batch-account-subnet) var_name='BATCH_ACCOUNT_SUBNET' ;;
              vm-image) var_name='VM_IMAGE' ;;
              cowbat-node-agent-sku) var_name='COWBAT_NODE_AGENT_SKU' ;;
              ampliseq-image) var_name='AMPLISEQ_IMAGE' ;;
              ampliseq-node-agent-sku) var_name='AMPLISEQ_NODE_AGENT_SKU' ;;
              cowsnphr-image) var_name='COWSNPHR_IMAGE' ;;
              cowsnphr-node-agent-sku) var_name='COWSNPHR_NODE_AGENT_SKU' ;;
              ad-app-id) var_name='AD_APP_ID' ;;
              ad-app-secret-id) var_name='AD_APP_SECRET_ID' ;;
              ad-app-secret) var_name='AD_APP_SECRET' ;;
              entra-id-client-id) var_name='ENTRA_ID_CLIENT_ID' ;;
              entra-id-client-secret) var_name='ENTRA_ID_CLIENT_SECRET' ;;
              entra-id-tenant-id) var_name='ENTRA_TENANT_ID' ;;
              redmine-default-from) var_name='REDMINE_DEFAULT_FROM' ;;
              email-host-user) var_name='EMAIL_HOST_USER' ;;
              email-host-password) var_name='EMAIL_HOST_PASSWORD' ;;
              email-relay-secret) var_name='EMAIL_RELAY_SECRET' ;;
              db-name) var_name='DB_NAME' ;;
              db-user) var_name='DB_USER' ;;
              db-pass) var_name='DB_PASS' ;;
              db-service) var_name='DB_SERVICE' ;;
              db-port) var_name='DB_PORT' ;;
              django-email-backend) var_name='DJANGO_EMAIL_BACKEND' ;;
              sentry-dsn) var_name='SENTRY_DSN' ;;
              environment) var_name='ENVIRONMENT' ;;
              connection-string) var_name='CONNECTION_STRING' ;;
              site-url) var_name='SITE_URL' ;;
              django-server-name) var_name='DJANGO_SERVER_NAME' ;;
              redmine-server-name) var_name='REDMINE_SERVER_NAME' ;;
              api-key) var_name='API_KEY' ;;
              dev-api-key) var_name='DEV_API_KEY' ;;
              maria-db-root-password) var_name='MARIA_DB_ROOT_PASSWORD' ;;
              mysql-password) var_name='MYSQL_PASSWORD' ;;
              subscription-id) var_name='SUBSCRIPTION_ID' ;;
              tenant-id) var_name='TENANT_ID' ;;
              client-id) var_name='CLIENT_ID' ;;
              client-secret) var_name='CLIENT_SECRET' ;;
              resource-group-name) var_name='RESOURCE_GROUP_NAME' ;;
              storage-account-name) var_name='STORAGE_ACCOUNT_NAME' ;;
              *) echo "Unknown secret mapping: $secret" >&2; exit 1 ;;
            esac
            if ! value="$(az keyvault secret show --vault-name "$vault" --name "$secret" --query value -o tsv)"; then
              echo "Failed to read Key Vault secret: $secret" >&2
              exit 1
            fi
            if [ -z "$value" ]; then
              echo "Key Vault secret $secret is empty" >&2
              exit 1
            fi
            printf '%s=%s\n' "$var_name" "$value" >> "$env_file"
            case "$var_name" in
              SUBSCRIPTION_ID|TENANT_ID|CLIENT_ID|CLIENT_SECRET|STORAGE_ACCOUNT_NAME|RESOURCE_GROUP_NAME|CONNECTION_STRING|MYSQL_PASSWORD|MARIA_DB_ROOT_PASSWORD|DB_PASS|EMAIL_HOST_USER|EMAIL_HOST_PASSWORD)
                printf '%s=%s\n' "$var_name" "$value" >> "$dotenv_file"
                ;;
            esac
          done
          printf 'FLOWER_USER=\nFLOWER_PASSWORD=\n' >> "$dotenv_file"
          chmod 600 "$env_file" "$dotenv_file"

          python3 "$REMOTE_DIR/remote_deploy_env.py"
          cd "$REMOTE_DIR"

          if command -v docker >/dev/null 2>&1; then
            rm -f celerybeat-schedule.db celerybeat.pid
            docker compose down
            docker compose up -d
            exit 0
          fi

          if sudo -n true 2>/dev/null; then
            sudo -n env PATH="$PATH" docker compose version || true
            sudo rm -f celerybeat-schedule.db celerybeat.pid
            sudo env PATH="$PATH" docker compose down || true
            sudo env PATH="$PATH" docker compose up -d
            exit 0
          fi

          echo 'ERROR: Docker CLI not available on this VM, or sudo requires a password.'
          echo '  - Install Docker and Docker Compose on the target VM.'
          echo '  - Make sure the target user is in the docker group or can run sudo docker commands.'
          if command -v sudo >/dev/null 2>&1; then
            echo 'DEBUG: sudo -l output:'
            sudo -l || true
          fi
          exit 1
        EOF
      displayName: 'Deploy portal on target VM'
