trigger: none
pr: none

resources:
  repositories:
  - repository: foodport-tf
    type: git
    name: FoodPort/foodport-tf
    trigger: none

parameters:
- name: destroy
  type: boolean
  default: false
- name: deployEnvironment
  type: string
  default: dev
  values:
    - dev
    - prod
- name: useHostedAgent
  type: boolean
  default: false
- name: hostedVmImage
  type: string
  default: 'ubuntu-latest'
- name: selfHostedPool
  type: string
  default: 'foodport-self-hosted'
- name: bootstrapRemoteVm
  type: boolean
  default: true

variables:
- name: DEPLOY_ENVIRONMENT
  value: ${{ parameters.deployEnvironment }}
- ${{ if eq(parameters.deployEnvironment, 'prod') }}:
  - name: DJANGO_SERVER_NAME
    value: 'foodport-dev.cloud-nuage.inspection.gc.ca'
- ${{ if eq(parameters.deployEnvironment, 'dev') }}:
  - name: DJANGO_SERVER_NAME
    value: '_'
- ${{ if eq(parameters.deployEnvironment, 'prod') }}:
  - name: REDMINE_SERVER_NAME
    value: 'redmine-dev.cloud-nuage.inspection.gc.ca'
- ${{ if eq(parameters.deployEnvironment, 'dev') }}:
  - name: REDMINE_SERVER_NAME
    value: '_'
- name: TARGET_HOST
  value: ''
- name: TARGET_SSH_USER
  value: 'cfiaadmin'
- name: TARGET_SSH_PORT
  value: '22'
- name: SELF_HOSTED_POOL
  value: ${{ parameters.selfHostedPool }}
- name: SELF_HOSTED_AGENT_NAME
  value: 'CFDC-FoodPort-self-hosted-agent-vm'

stages:
- stage: EnsureSelfHostedAgent
  displayName: 'Ensure self-hosted agent'
  condition: and(succeeded(), ne(${{ parameters.useHostedAgent }}, true), ne(${{ parameters.destroy }}, true))
  jobs:
  - job: EnsureAgent
    displayName: 'Ensure self-hosted agent is available'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: none
    - script: |
        set -euo pipefail

        if [ -z "${SYSTEM_ACCESSTOKEN:-}" ] && [ -z "${SELF_HOSTED_AGENT_PAT:-}" ]; then
          echo "##vso[task.logissue type=error]Neither SYSTEM_ACCESSTOKEN nor SELF_HOSTED_AGENT_PAT is available. Set a PAT in the pipeline variable SELF_HOSTED_AGENT_PAT or enable OAuth token access."
          exit 1
        fi

        python3 - <<'PY'
        import base64
        import json
        import os
        import sys
        import time
        import urllib.error
        import urllib.parse
        import urllib.request

        org_uri = os.environ['SYSTEM_COLLECTIONURI'].rstrip('/')
        project = os.environ['SYSTEM_TEAMPROJECT']
        pool_name = os.environ['SELF_HOSTED_POOL']
        pipeline_id = os.environ['SELF_HOSTED_BOOTSTRAP_PIPELINE_ID']
        wait_seconds = int(os.environ.get('SELF_HOSTED_AGENT_WAIT_SECONDS', '450'))
        interval = int(os.environ.get('SELF_HOSTED_AGENT_POLL_INTERVAL', '30'))
        token = os.environ.get('SELF_HOSTED_AGENT_PAT') or os.environ['SYSTEM_ACCESSTOKEN']

        auth = base64.b64encode(f':{token}'.encode()).decode()
        headers = {
            'Authorization': f'Basic {auth}',
            'Content-Type': 'application/json'
        }

        def http_request(path, method='GET', body=None):
            if path.startswith('/_apis/distributedtask'):
                url = f'{org_uri}{path}'
            else:
                url = f'{org_uri}/{project}{path}'
            print(f'Calling Azure DevOps REST API: {method} {url}', file=sys.stderr)
            data = None
            if body is not None:
                data = json.dumps(body).encode('utf-8')
            req = urllib.request.Request(url, data=data, headers=headers, method=method)
            try:
                with urllib.request.urlopen(req) as resp:
                    return json.load(resp)
            except urllib.error.HTTPError as e:
                body = e.read().decode('utf-8', errors='ignore')
                print(f'HTTP {e.code} {e.reason} for {e.url}', file=sys.stderr)
                if body:
                    print('Response body:', file=sys.stderr)
                    print(body, file=sys.stderr)
                if e.code in (401, 403):
                    print('Unauthorized: pipeline lacks permission to access Azure DevOps resources or the OAuth token is insufficient.', file=sys.stderr)
                    sys.exit(1)
                if e.code == 404:
                    print('Not found: the self-hosted pool or another referenced Azure DevOps resource was not found.', file=sys.stderr)
                    sys.exit(1)
                raise

        print(f'SYSTEM_COLLECTIONURI={org_uri}', file=sys.stderr)
        print(f'SYSTEM_TEAMPROJECT={project}', file=sys.stderr)
        print(f'SELF_HOSTED_POOL={pool_name}', file=sys.stderr)
        print(f'SELF_HOSTED_BOOTSTRAP_PIPELINE_ID={pipeline_id}', file=sys.stderr)
        print(f'WAIT_SECONDS={wait_seconds}', file=sys.stderr)
        print(f'POLL_INTERVAL={interval}', file=sys.stderr)
        print('Using SELF_HOSTED_AGENT_PAT' if os.environ.get('SELF_HOSTED_AGENT_PAT') else 'Using SYSTEM_ACCESSTOKEN', file=sys.stderr)
        try:
            debug_pools = http_request('/_apis/distributedtask/pools?api-version=7.0')
            debug_pool_names = [p.get('name', '<missing>') for p in debug_pools.get('value', [])]
            print(f'Visible pool count: {len(debug_pool_names)}', file=sys.stderr)
            print('Visible pool names: ' + ', '.join(debug_pool_names), file=sys.stderr)
        except Exception as e:
            print(f'Failed to list pools for debug: {e}', file=sys.stderr)

        def get_pool_id():
            q = urllib.parse.urlencode({'poolName': pool_name, 'api-version': '7.0'})
            response = http_request(f'/_apis/distributedtask/pools?{q}')
            pools = response.get('value', [])
            if not pools:
                print(f'No self-hosted pool found with name: {pool_name}. Check pool existence and authorization.', file=sys.stderr)
                sys.exit(1)
            return pools[0]['id']

        def get_online_agents(pool_id):
            q = urllib.parse.urlencode({'api-version': '7.0'})
            response = http_request(f'/_apis/distributedtask/pools/{pool_id}/agents?{q}')
            agents = response.get('value', [])
            return [a for a in agents if a.get('status') == 'online' and a.get('enabled', True)]

        def active_bootstrap_run_exists():
            q = urllib.parse.urlencode({'stateFilter': 'inProgress', 'api-version': '7.1-preview.1'})
            response = http_request(f'/_apis/pipelines/{pipeline_id}/runs?{q}')
            runs = response.get('value', [])
            in_progress_runs = [r for r in runs if r.get('state') == 'inProgress']
            print(f'Active bootstrap run check response for pipeline {pipeline_id}: {json.dumps(response)}', file=sys.stderr)
            print(f'Total returned run count: {len(runs)}', file=sys.stderr)
            print(f'In-progress run count: {len(in_progress_runs)}', file=sys.stderr)
            for run in in_progress_runs:
                run_id = run.get('id')
                run_state = run.get('state')
                run_result = run.get('result')
                run_url = run.get('_links', {}).get('web', {}).get('href')
                print(f'In-progress run: id={run_id} state={run_state} result={run_result} url={run_url}', file=sys.stderr)
            return bool(in_progress_runs)

        pool_id = get_pool_id()
        online = get_online_agents(pool_id)
        if online:
            print(f'Self-hosted pool "{pool_name}" already has {len(online)} online agent(s).')
            sys.exit(0)

        if active_bootstrap_run_exists():
            print('A self-hosted bootstrap pipeline run is already in progress; waiting for the agent to come online.')
        else:
            print('No online self-hosted agent found; queueing bootstrap pipeline.')
            body = {
                'resources': {'repositories': {'self': {'refName': 'refs/heads/main'}}},
                'variables': {'System.Debug': {'value': 'true'}}
            }
            response = http_request(f'/_apis/pipelines/{pipeline_id}/runs?api-version=7.1-preview.1', method='POST', body=body)
            print('Queued bootstrap pipeline run id:', response.get('id'))

        deadline = time.time() + wait_seconds
        while time.time() < deadline:
            online = get_online_agents(pool_id)
            if online:
                print(f'Self-hosted agent is online after waiting {int(time.time() + 0 - (deadline - wait_seconds))} seconds.')
                sys.exit(0)
            print(f'No agent online yet; sleeping {interval}s...', file=sys.stderr)
            time.sleep(interval)

        print(f'Timed out waiting for a self-hosted agent in pool "{pool_name}" after {wait_seconds} seconds.', file=sys.stderr)
        sys.exit(1)
        PY
      displayName: 'Check self-hosted pool and queue bootstrap if needed'
      env:
        SELF_HOSTED_POOL: $(selfHostedPool)
        SELF_HOSTED_BOOTSTRAP_PIPELINE_ID: '974'
        SELF_HOSTED_AGENT_WAIT_SECONDS: '450'
        SELF_HOSTED_AGENT_POLL_INTERVAL: '30'
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        SELF_HOSTED_AGENT_PAT: $(SELF_HOSTED_AGENT_PAT)

- stage: ProvisionFullInfra
  displayName: 'Provision full infrastructure'
  condition: succeeded()
  jobs:
  - job: Terraform
    displayName: Full Infra Terraform
    pool:
      ${{ if eq(parameters.useHostedAgent, true) }}:
        vmImage: ${{ parameters.hostedVmImage }}
      ${{ if ne(parameters.useHostedAgent, true) }}:
        name: ${{ parameters.selfHostedPool }}
    steps:
    - checkout: self
      persistCredentials: true
    - checkout: foodport-tf
      path: foodport-tf
      persistCredentials: true

    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@0
      displayName: Install Terraform
      inputs:
        terraformVersion: 'latest'

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.x'

    - ${{ if not(parameters.destroy) }}:
      - task: AzureCLI@2
        displayName: Apply Terraform for full infra
        env:
          SSH_PUBLIC_KEY: $(sshPublicKey)
        inputs:
          azureSubscription: 'CFDC-FoodPort-service-connection'
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -e
            cd "$(Pipeline.Workspace)/foodport-tf/full-infra"
            if [ -z "${SSH_PUBLIC_KEY:-}" ]; then
              echo "ERROR: sshPublicKey pipeline variable is not defined or is empty."
              exit 1
            fi
            export TF_VAR_ssh_public_key="${SSH_PUBLIC_KEY}"
            terraform init
            terraform plan -out=tfplan
            terraform apply -auto-approve tfplan

            VM_IP="$(terraform output -raw portal_vm_private_ip)"
            echo "$VM_IP" > vm_ip.txt

      - task: PublishPipelineArtifact@1
        displayName: Publish portal VM IP artifact
        inputs:
          targetPath: '$(Pipeline.Workspace)/foodport-tf/full-infra/vm_ip.txt'
          artifact: 'fullInfra'

    - ${{ if parameters.destroy }}:
      - task: AzureCLI@2
        displayName: Destroy Terraform-managed full infra
        env:
          SSH_PUBLIC_KEY: $(sshPublicKey)
        inputs:
          azureSubscription: 'CFDC-FoodPort-service-connection'
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -e
            cd "$(Pipeline.Workspace)/foodport-tf/full-infra"
            if [ -z "${SSH_PUBLIC_KEY:-}" ]; then
              echo "ERROR: sshPublicKey pipeline variable is not defined or is empty."
              exit 1
            fi
            export TF_VAR_ssh_public_key="${SSH_PUBLIC_KEY}"
            terraform init
            terraform destroy -auto-approve

- stage: BootstrapRemoteVm
  displayName: 'Bootstrap remote VM'
  condition: and(succeeded(), eq(${{ parameters.bootstrapRemoteVm }}, true), ne(${{ parameters.destroy }}, true))
  dependsOn:
    - ProvisionFullInfra
    - EnsureSelfHostedAgent
  jobs:
  - job: Bootstrap
    displayName: 'Bootstrap remote VM'
    pool:
      ${{ if eq(parameters.useHostedAgent, true) }}:
        vmImage: ${{ parameters.hostedVmImage }}
      ${{ if ne(parameters.useHostedAgent, true) }}:
        name: $(SELF_HOSTED_POOL)
    steps:
    - task: DownloadPipelineArtifact@2
      displayName: 'Download full infra artifact'
      inputs:
        artifact: 'fullInfra'
        path: '$(Pipeline.Workspace)'

    - script: |
        set -euo pipefail

        ARTIFACT_DIR="$(Pipeline.Workspace)"
        echo "Listing downloaded artifact contents: ${artifact_dir}"
        find "${artifact_dir}" -maxdepth 6 -type f | sort

        artifact_file=$(find "${artifact_dir}" -type f -name 'vm_ip.txt' | head -n 1 || true)
        if [ -z "${artifact_file:-}" ]; then
          echo "ERROR: full infra artifact file vm_ip.txt not found under ${artifact_dir}"
          exit 1
        fi

        TARGET_HOST=$(cat "${artifact_file}")
        if [ -z "${TARGET_HOST:-}" ]; then
          echo "ERROR: full infra artifact file is empty: ${artifact_file}"
          exit 1
        fi

        echo "Found vm_ip.txt at: ${artifact_file}"
        echo "##vso[task.setvariable variable=TARGET_HOST]$TARGET_HOST"
      displayName: 'Load TARGET_HOST from full infra artifact'

    - task: DownloadSecureFile@1
      name: rootCA
      inputs:
        secureFile: 'GoC-GdC-Root-A.crt'

    - task: DownloadSecureFile@1
      name: tlsCert
      inputs:
        secureFile: 'cloud-nuage.crt'

    - task: DownloadSecureFile@1
      name: tlsKey
      inputs:
        secureFile: 'cloud-nuage.key'

    - task: DownloadSecureFile@1
      name: tlsChain
      inputs:
        secureFile: 'cloud-nuage-chain.pem'

    - task: DownloadSecureFile@1
      name: sshKey
      inputs:
        secureFile: 'portal_ssh_key'

    - script: |
        set -euo pipefail
        chmod 600 "$(sshKey.secureFilePath)"
        scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$(sshKey.secureFilePath)" -P "${TARGET_SSH_PORT}" "$(rootCA.secureFilePath)" "${TARGET_SSH_USER}@${TARGET_HOST}:/tmp/GoC-GdC-Root-A.crt"
        scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$(sshKey.secureFilePath)" -P "${TARGET_SSH_PORT}" "$(tlsCert.secureFilePath)" "${TARGET_SSH_USER}@${TARGET_HOST}:/tmp/cloud-nuage.crt"
        scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$(sshKey.secureFilePath)" -P "${TARGET_SSH_PORT}" "$(tlsKey.secureFilePath)" "${TARGET_SSH_USER}@${TARGET_HOST}:/tmp/cloud-nuage.key"
        scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$(sshKey.secureFilePath)" -P "${TARGET_SSH_PORT}" "$(tlsChain.secureFilePath)" "${TARGET_SSH_USER}@${TARGET_HOST}:/tmp/cloud-nuage-chain.pem"
        if [ -n "${SSH_PUBLIC_KEY:-}" ]; then
          derived_pub=$(ssh-keygen -y -f "$(sshKey.secureFilePath)" 2>/tmp/sshkeygen.err || true)
          if [ -z "$derived_pub" ]; then
            echo "WARNING: failed to derive public key from private key file; skipping public-key matching check."
            echo "ssh-keygen details:"
            sed 's/^/  /' /tmp/sshkeygen.err || true
          elif [ "$derived_pub" != "$SSH_PUBLIC_KEY" ]; then
            echo "ERROR: the private key in secure file does not match sshPublicKey"
            echo "Please provide the matching private key for the public key used by Terraform."
            exit 1
          fi
          rm -f /tmp/sshkeygen.err
        fi
        ssh -o StrictHostKeyChecking=no -i "$(sshKey.secureFilePath)" -p "${TARGET_SSH_PORT}" "${TARGET_SSH_USER}@${TARGET_HOST}" <<EOF
          set -e
          sudo cp /tmp/GoC-GdC-Root-A.crt /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt
          sudo chmod 644 /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt
          sudo update-ca-certificates
          sudo mkdir -p /etc/foodport/tls
          sudo cp /tmp/cloud-nuage.crt /etc/foodport/tls/cloud-nuage.crt
          sudo cp /tmp/cloud-nuage.key /etc/foodport/tls/cloud-nuage.key
          sudo cp /tmp/cloud-nuage-chain.pem /etc/foodport/tls/cloud-nuage-chain.pem
          sudo chmod 644 /etc/foodport/tls/cloud-nuage.crt
          sudo chmod 600 /etc/foodport/tls/cloud-nuage.key
          sudo chmod 644 /etc/foodport/tls/cloud-nuage-chain.pem
          sudo rm -f /etc/apt/sources.list.d/docker.list
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg lsb-release git python3 python3-pip python3-venv apt-transport-https software-properties-common

          if ! command -v docker >/dev/null 2>&1; then
            echo "DEBUG: docker not installed, entering docker bootstrap block"
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --batch --yes --no-tty --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
            sudo mkdir -p /etc/apt/sources.list.d
            arch="\$(dpkg --print-architecture)"
            codename="\$(lsb_release -cs)"
            ts="\$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sudo rm -f /etc/apt/sources.list.d/docker.list
            sudo bash -lc "printf '### generated: %s\n' \"\$ts\" > /etc/apt/sources.list.d/docker.list"
            sudo bash -lc "printf 'deb [arch=%s signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu %s stable\n' \"\$arch\" \"\$codename\" >> /etc/apt/sources.list.d/docker.list"
            sudo ls -l /etc/apt/sources.list.d/docker.list
            sudo cat /etc/apt/sources.list.d/docker.list
            sudo DEBIAN_FRONTEND=noninteractive apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io
            sudo usermod -aG docker "${TARGET_SSH_USER}"
          fi

          if ! command -v docker compose >/dev/null 2>&1; then
            sudo apt-get install -y docker-compose-plugin
          fi

          if ! command -v az >/dev/null 2>&1; then
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          fi

          if [ ! -x "/home/${TARGET_SSH_USER}/miniconda/bin/conda" ]; then
            curl -fsSL https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -o /tmp/miniconda.sh
            bash /tmp/miniconda.sh -b -p "/home/${TARGET_SSH_USER}/miniconda"
            rm /tmp/miniconda.sh
          else
            echo "Conda already installed at /home/${TARGET_SSH_USER}/miniconda"
          fi
          if ! grep -qxF "export PATH=\"/home/${TARGET_SSH_USER}/miniconda/bin:\$PATH\"" "/home/${TARGET_SSH_USER}/.bashrc"; then
            echo "export PATH=\"/home/${TARGET_SSH_USER}/miniconda/bin:\$PATH\"" >> "/home/${TARGET_SSH_USER}/.bashrc"
          fi
          export PATH="/home/${TARGET_SSH_USER}/miniconda/bin:$PATH"
          /home/${TARGET_SSH_USER}/miniconda/bin/conda init bash || true
          /home/${TARGET_SSH_USER}/miniconda/bin/conda config --set always_yes yes --set changeps1 no
          export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
          export REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
          /home/${TARGET_SSH_USER}/miniconda/bin/conda config --set ssl_verify /etc/ssl/certs/ca-certificates.crt
          /home/${TARGET_SSH_USER}/miniconda/bin/conda config --prepend channels conda-forge
          /home/${TARGET_SSH_USER}/miniconda/bin/conda config --prepend channels bioconda
          /home/${TARGET_SSH_USER}/miniconda/bin/conda config --prepend channels olcbioinformatics
          /home/${TARGET_SSH_USER}/miniconda/bin/conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main
          /home/${TARGET_SSH_USER}/miniconda/bin/conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/r
          /home/${TARGET_SSH_USER}/miniconda/bin/conda install -q mamba -n base
        EOF
      env:
        SSH_PUBLIC_KEY: $(sshPublicKey)
      displayName: 'Bootstrap remote VM with Docker, Docker Compose, Git, Python, Conda, and Azure CLI'

- stage: DeployPortal
  displayName: 'Deploy portal'
  dependsOn: BootstrapRemoteVm
  condition: succeeded()
  jobs:
  - job: Deploy
    displayName: 'Deploy portal'
    pool:
      ${{ if eq(parameters.useHostedAgent, true) }}:
        vmImage: ${{ parameters.hostedVmImage }}
      ${{ if ne(parameters.useHostedAgent, true) }}:
        name: $(SELF_HOSTED_POOL)
        demands:
        - Agent.Name -equals $(SELF_HOSTED_AGENT_NAME)
    steps:
    - task: DownloadSecureFile@1
      name: rootCA
      inputs:
        secureFile: 'GoC-GdC-Root-A.crt'

    - script: |
        cp "$(rootCA.secureFilePath)" "$(Build.SourcesDirectory)/redmine/GoC-GdC-Root-A.crt"
        cp "$(rootCA.secureFilePath)" "$(Build.SourcesDirectory)/GoC-GdC-Root-A.crt"
      displayName: Copy root CA into Docker build contexts

    - task: AzureCLI@2
      displayName: 'Fetch Key Vault secrets via Azure CLI'
      inputs:
        azureSubscription: 'CFDC-FoodPort-service-connection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          vault='FoodPort-key-vault'
          env_file="$BUILD_SOURCESDIRECTORY/env"
          dotenv_file="$BUILD_SOURCESDIRECTORY/.env"
          mkdir -p "$(dirname "$env_file")"
          : > "$env_file"
          : > "$dotenv_file"
          secrets=(
            secret-key-base
            redmine-database-password
            azure-account-name
            azure-account-key
            batch-account-name
            batch-account-url
            batch-account-key
            batch-account-subnet
            vm-image
            cowbat-node-agent-sku
            ampliseq-image
            ampliseq-node-agent-sku
            cowsnphr-image
            cowsnphr-node-agent-sku
            vm-client-id
            vm-secret
            vm-tenant
            ad-app-id
            ad-app-secret-id
            ad-app-secret
            entra-id-client-id
            entra-id-client-secret
            entra-id-tenant-id
            redmine-default-from
            email-host-user
            email-host-password
            email-relay-secret
            db-name
            db-user
            db-pass
            db-service
            db-port
            django-email-backend
            sentry-dsn
            environment
            connection-string
            site-url
            django-server-name
            redmine-server-name
            api-key
            dev-api-key
            maria-db-root-password
            mysql-password
            subscription-id
            tenant-id
            client-id
            client-secret
            resource-group-name
            storage-account-name
          )

          for secret in "${secrets[@]}"; do
            case "$secret" in
              secret-key-base) var_name='SECRET_KEY_BASE' ;;
              redmine-database-password) var_name='REDMINE_DB_PASSWORD' ;;
              azure-account-name) var_name='AZURE_ACCOUNT_NAME' ;;
              azure-account-key) var_name='AZURE_ACCOUNT_KEY' ;;
              batch-account-name) var_name='BATCH_ACCOUNT_NAME' ;;
              batch-account-url) var_name='BATCH_ACCOUNT_URL' ;;
              batch-account-key) var_name='BATCH_ACCOUNT_KEY' ;;
              batch-account-subnet) var_name='BATCH_ACCOUNT_SUBNET' ;;
              vm-image) var_name='VM_IMAGE' ;;
              cowbat-node-agent-sku) var_name='COWBAT_NODE_AGENT_SKU' ;;
              ampliseq-image) var_name='AMPLISEQ_IMAGE' ;;
              ampliseq-node-agent-sku) var_name='AMPLISEQ_NODE_AGENT_SKU' ;;
              cowsnphr-image) var_name='COWSNPHR_IMAGE' ;;
              cowsnphr-node-agent-sku) var_name='COWSNPHR_NODE_AGENT_SKU' ;;
              vm-client-id) var_name='VM_CLIENT_ID' ;;
              vm-secret) var_name='VM_SECRET' ;;
              vm-tenant) var_name='VM_TENANT' ;;
              ad-app-id) var_name='AD_APP_ID' ;;
              ad-app-secret-id) var_name='AD_APP_SECRET_ID' ;;
              ad-app-secret) var_name='AD_APP_SECRET' ;;
              entra-id-client-id) var_name='ENTRA_ID_CLIENT_ID' ;;
              entra-id-client-secret) var_name='ENTRA_ID_CLIENT_SECRET' ;;
              entra-id-tenant-id) var_name='ENTRA_ID_TENANT_ID' ;;
              redmine-default-from) var_name='REDMINE_DEFAULT_FROM' ;;
              email-host-user) var_name='EMAIL_HOST_USER' ;;
              email-host-password) var_name='EMAIL_HOST_PASSWORD' ;;
              email-relay-secret) var_name='EMAIL_RELAY_SECRET' ;;
              db-name) var_name='DB_NAME' ;;
              db-user) var_name='DB_USER' ;;
              db-pass) var_name='DB_PASS' ;;
              db-service) var_name='DB_SERVICE' ;;
              db-port) var_name='DB_PORT' ;;
              django-email-backend) var_name='DJANGO_EMAIL_BACKEND' ;;
              sentry-dsn) var_name='SENTRY_DSN' ;;
              environment) var_name='ENVIRONMENT' ;;
              connection-string) var_name='CONNECTION_STRING' ;;
              site-url) var_name='SITE_URL' ;;
              django-server-name) var_name='DJANGO_SERVER_NAME' ;;
              redmine-server-name) var_name='REDMINE_SERVER_NAME' ;;
              api-key) var_name='API_KEY' ;;
              dev-api-key) var_name='DEV_API_KEY' ;;
              maria-db-root-password) var_name='MARIA_DB_ROOT_PASSWORD' ;;
              mysql-password) var_name='MYSQL_PASSWORD' ;;
              subscription-id) var_name='SUBSCRIPTION_ID' ;;
              tenant-id) var_name='TENANT_ID' ;;
              client-id) var_name='CLIENT_ID' ;;
              client-secret) var_name='CLIENT_SECRET' ;;
              resource-group-name) var_name='RESOURCE_GROUP_NAME' ;;
              storage-account-name) var_name='STORAGE_ACCOUNT_NAME' ;;
              *) echo "Unknown secret mapping: $secret" >&2; exit 1 ;;
            esac

            value="$(az keyvault secret show --vault-name "$vault" --name "$secret" --query value -o tsv)"
            if [ $? -ne 0 ]; then
              echo "Failed to read Key Vault secret: $secret" >&2
              exit 1
            fi
            if [ -z "$value" ]; then
              echo "Key Vault secret $secret is empty" >&2
              exit 1
            fi
            echo "##vso[task.setvariable variable=$var_name;issecret=true]$value"
            printf '%s=%s\n' "$var_name" "$value" >> "$BUILD_SOURCESDIRECTORY/env"
            case "$var_name" in
              SUBSCRIPTION_ID|TENANT_ID|CLIENT_ID|CLIENT_SECRET|STORAGE_ACCOUNT_NAME|RESOURCE_GROUP_NAME|CONNECTION_STRING|MYSQL_PASSWORD|MARIA_DB_ROOT_PASSWORD|DB_PASS|EMAIL_HOST_USER|EMAIL_HOST_PASSWORD)
                printf '%s=%s\n' "$var_name" "$value" >> "$BUILD_SOURCESDIRECTORY/.env"
                ;;
            esac
            echo "Fetched Key Vault secret $secret as pipeline variable $var_name"
          done
          printf 'FLOWER_USER=\nFLOWER_PASSWORD=\n' >> "$BUILD_SOURCESDIRECTORY/.env"
          chmod 600 "$BUILD_SOURCESDIRECTORY/env" "$BUILD_SOURCESDIRECTORY/.env"

    - script: |
        set -euo pipefail
        env_file="${BUILD_SOURCESDIRECTORY}/env"
        dotenv_file="${BUILD_SOURCESDIRECTORY}/.env"
        if [ ! -f "$env_file" ] || [ ! -f "$dotenv_file" ]; then
          echo "Expected env files to exist, but one or both are missing:" >&2
          ls -l "${BUILD_SOURCESDIRECTORY}" || true
          exit 1
        fi
        echo 'Env files generated by Azure CLI Key Vault fetch step.'
      displayName: 'Confirm generated env file exists'

    - script: |
        python3 <<'PY'
        import os
        import os.path

        def parse(path):
            values = {}
            if not os.path.exists(path):
                return values
            with open(path, encoding='utf-8') as f:
                for line in f:
                    if not line.strip() or line.strip().startswith('#') or '=' not in line:
                        continue
                    key, _, value = line.rstrip('\n').partition('=')
                    values[key] = value
            return values

        env_path = os.path.join(os.environ['BUILD_SOURCESDIRECTORY'], 'env')
        values = parse(env_path)
        required = [
            'SECRET_KEY_BASE',
            'REDMINE_DB_PASSWORD',
            'AZURE_ACCOUNT_NAME',
            'AZURE_ACCOUNT_KEY',
            'DB_PASS',
            'MYSQL_PASSWORD',
            'DJANGO_SERVER_NAME',
            'REDMINE_SERVER_NAME',
        ]

        for key in required:
            print(f"{key}: {'present' if values.get(key) else 'MISSING'}")

        missing = [key for key in required if not values.get(key)]
        if missing:
            raise SystemExit('Missing required generated env values: ' + ', '.join(missing))
        PY
      displayName: 'Debug generated env file presence'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download full infra artifact for deploy'
      inputs:
        artifact: 'fullInfra'
        path: '$(Pipeline.Workspace)'

    - script: |
        set -e
        ARTIFACT_DIR="$(Pipeline.Workspace)/fullInfra"
        VM_IP_FILE=$(find "$ARTIFACT_DIR" -type f -name 'vm_ip.txt' | head -n 1 || true)
        if [ -z "${VM_IP_FILE:-}" ]; then
          echo "ERROR: vm_ip.txt not found under $ARTIFACT_DIR"
          find "$ARTIFACT_DIR" -maxdepth 6 -type f | sort
          exit 1
        fi
        VM_IP=$(cat "$VM_IP_FILE")
        ENV_FILE="${BUILD_SOURCESDIRECTORY}/env"
        if grep -q '^DJANGO_ALLOWED_HOSTS=' "$ENV_FILE"; then
          sed -i "s|^DJANGO_ALLOWED_HOSTS=.*|DJANGO_ALLOWED_HOSTS=0.0.0.0,localhost,127.0.0.1,$VM_IP|" "$ENV_FILE"
        else
          echo "DJANGO_ALLOWED_HOSTS=0.0.0.0,localhost,127.0.0.1,$VM_IP" >> "$ENV_FILE"
        fi
      displayName: 'Set portal VM IP in env file from full-infra artifact'

    - script: |
        python3 <<'PY'
        import os
        import secrets
        import sys
        from pathlib import Path

        def parse(path):
            values = {}
            with open(path, encoding='utf-8') as f:
                for line in f:
                    if not line.strip() or line.strip().startswith('#') or '=' not in line:
                        continue
                    key, _, value = line.rstrip('\n').partition('=')
                    values[key] = value
            return values

        root = Path(os.environ['BUILD_SOURCESDIRECTORY'])
        env_values = parse(root / 'env')
        secrets_src = root / 'redmine' / 'config' / 'secrets.yml.template'
        secrets_dst = root / 'redmine' / 'config' / 'secrets.yml'

        text = secrets_src.read_text(encoding='utf-8')
        secret_key = env_values.get('SECRET_KEY_BASE') or env_values.get('secret-key-base')
        if not secret_key:
            secret_key = secrets.token_hex(64)
            print('Generated SECRET_KEY_BASE fallback for Redmine', file=sys.stderr)

        text = text.replace('${SECRET_KEY_BASE}', secret_key)
        secrets_dst.write_text(text, encoding='utf-8')

        db_src = root / 'redmine' / 'config' / 'database.yml.template'
        db_dst = root / 'redmine' / 'config' / 'database.yml'

        db_text = db_src.read_text(encoding='utf-8')
        db_password = env_values.get('REDMINE_DB_PASSWORD') or env_values.get('REDMINE_DATABASE_PASSWORD') or env_values.get('redmine-database-password')
        if not db_password:
            raise SystemExit('Required REDMINE_DB_PASSWORD / REDMINE_DATABASE_PASSWORD / redmine-database-password is missing in env file')

        db_text = db_text.replace('${REDMINE_DB_PASSWORD}', db_password)
        db_dst.write_text(db_text, encoding='utf-8')
        PY
      displayName: 'Render redmine config files from templates'

    - script: |
        python3 <<'PY'
        import os
        from pathlib import Path

        def parse(path):
            values = {}
            with open(path, encoding='utf-8') as f:
                for line in f:
                    if not line.strip() or line.strip().startswith('#') or '=' not in line:
                        continue
                    key, _, value = line.rstrip('\n').partition('=')
                    values[key] = value
            return values

        root = Path(os.environ['BUILD_SOURCESDIRECTORY'])
        env_values = parse(root / 'env')
        deploy_env = env_values.get('DEPLOY_ENVIRONMENT', 'dev').lower()
        if deploy_env not in ('dev', 'prod'):
            raise SystemExit(f'Unsupported DEPLOY_ENVIRONMENT: {deploy_env}')

        django_server_name = env_values.get('DJANGO_SERVER_NAME')
        if not django_server_name:
            raise SystemExit('Required env file value DJANGO_SERVER_NAME is missing')

        src = root / 'nginx' / 'templates' / 'django.template'
        dst = root / 'nginx' / 'sites-enabled' / 'django'
        text = src.read_text(encoding='utf-8')
        text = text.replace('${DJANGO_SERVER_NAME}', django_server_name)
        dst.write_text(text, encoding='utf-8')

        https_dst = root / 'nginx' / 'sites-enabled' / 'django-https'
        if deploy_env == 'prod':
            redmine_server_name = env_values.get('REDMINE_SERVER_NAME')
            if not redmine_server_name:
                raise SystemExit('Required env file value REDMINE_SERVER_NAME is missing')
            src = root / 'nginx' / 'templates' / 'django-https.template'
            text = src.read_text(encoding='utf-8')
            text = text.replace('${DJANGO_SERVER_NAME}', django_server_name)
            text = text.replace('${REDMINE_SERVER_NAME}', redmine_server_name)
            https_dst.write_text(text, encoding='utf-8')
        else:
            if https_dst.exists():
                https_dst.unlink()
        PY
      displayName: 'Generate nginx site configs from templates'

    - script: |
        cd "$(Build.SourcesDirectory)"
        sudo rm -f celerybeat-schedule.db celerybeat.pid
        docker compose down
        docker compose up -d
      displayName: 'Restart containers'
