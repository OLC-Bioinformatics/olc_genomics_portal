services:
  selenium:
    image: selenium/standalone-firefox:157.0-geckodriver-0.37-grid-4.52.0-20261101
    shm_size: 2gb
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:4444/status | grep -Eq '"ready":[[:space:]]*true'
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: nginx:stable

  static-nginx:
    build:
      context: ./nginx
    depends_on:
      web:
        condition: service_started
    volumes:
      - browser-test-staticfiles:/data/web/staticfiles:ro

  test-runner:
    depends_on:
      selenium:
        condition: service_healthy
      static-nginx:
        condition: service_started
    environment:
      FOODPORT_SELENIUM_URL: http://selenium:4444
      FOODPORT_STATIC_ASSET_BASE_URL: http://static-nginx
    command:
      - /bin/bash
      - -lc
      - >-
        python manage.py collectstatic --noinput --clear &&
        pytest -q --tb=short
        olc_webportalv2/primer_finder/test_browser_ui.py
        config/test_static_asset_http.py
    volumes:
      - browser-test-staticfiles:/data/web/staticfiles

volumes:
  browser-test-staticfiles:
