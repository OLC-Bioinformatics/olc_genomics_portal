trigger: none
pr: none

resources:
  repositories:
  - repository: foodport-tf
    type: git
    name: FoodPort/foodport-tf
    trigger: none

parameters:
- name: destroy
  type: boolean
  default: false
- name: deployEnvironment
  type: string
  default: dev
  values:
    - dev
    - prod
- name: useHostedAgent
  type: boolean
  default: false
- name: hostedVmImage
  type: string
  default: 'ubuntu-latest'
# Set false to redeploy on an already-bootstrapped VM without running host setup again.
- name: bootstrapRemoteVm
  type: boolean
  default: true
- name: azureServiceConnection
  type: string
  default: CFDC-FoodPort-managed-identity
  values:
    - CFDC-FoodPort-managed-identity

variables:
- name: DEPLOY_ENVIRONMENT
  value: ${{ parameters.deployEnvironment }}
- ${{ if eq(parameters.deployEnvironment, 'prod') }}:
  - name: DJANGO_SERVER_NAME
    value: 'foodport-dev.cloud-nuage.inspection.gc.ca'
- ${{ if eq(parameters.deployEnvironment, 'dev') }}:
  - name: DJANGO_SERVER_NAME
    value: '_'
- ${{ if eq(parameters.deployEnvironment, 'prod') }}:
  - name: REDMINE_SERVER_NAME
    value: 'redmine-dev.cloud-nuage.inspection.gc.ca'
- ${{ if eq(parameters.deployEnvironment, 'dev') }}:
  - name: REDMINE_SERVER_NAME
    value: '_'
- name: TARGET_HOST
  value: ''
- name: TARGET_SSH_USER
  value: 'cfiaadmin'
- name: TARGET_SSH_PORT
  value: '22'
- name: existingNetworkRg
  value: 'CFDC-FoodPort-network-rg'
- name: existingVnetName
  value: 'CFDC-FoodPort-vnet'
- name: existingSubnetName
  value: 'CFDC-FoodPort-Portal-snet'

stages:
- stage: ProvisionDevVm
  displayName: 'Provision Dev VM'
  condition: succeeded()
  jobs:
  - job: Terraform
    displayName: Dev VM Terraform
    pool:
      ${{ if eq(parameters.useHostedAgent, true) }}:
        vmImage: ${{ parameters.hostedVmImage }}
      ${{ if ne(parameters.useHostedAgent, true) }}:
        name: CFDC-FoodPort-MDP-pool
    steps:
    - checkout: self
      persistCredentials: true
    - checkout: foodport-tf
      path: foodport-tf
      persistCredentials: true

    - task: DownloadSecureFile@1
      name: agentRootCA
      inputs:
        secureFile: 'GoC-GdC-Root-A.crt'

    - script: |
        set -euo pipefail
        if ! command -v update-ca-certificates >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates
        fi
        sudo install -D -m 0644 "$(agentRootCA.secureFilePath)" /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt
        sudo update-ca-certificates
        if ! command -v curl >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl unzip
        fi
        curl --fail --show-error --silent --location --connect-timeout 10 --max-time 30 \
          --output /dev/null --write-out 'MDP PyPI TLS check passed (HTTP %{http_code})\n' \
          https://pypi.org/simple/pip/
        if ! command -v az >/dev/null 2>&1; then
          installer="$(mktemp)"
          trap 'rm -f -- "$installer"' EXIT
          curl --fail --show-error --location --retry 3 --retry-all-errors --output "$installer" https://aka.ms/InstallAzureCLIDeb
          sudo bash "$installer"
        fi
        az version
      displayName: Ensure Azure CLI is installed
      env:
        CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt

    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@0
      displayName: Install Terraform
      env:
        NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt
      inputs:
        terraformVersion: '1.9.8'

    - ${{ if not(parameters.destroy) }}:
      - task: AzureCLI@2
        displayName: Apply Terraform for Dev VM
        env:
          SSH_PUBLIC_KEY: $(sshPublicKey)
          CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
          NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt
        inputs:
          azureSubscription: ${{ parameters.azureServiceConnection }}
          addSpnToEnvironment: true
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            if [ -z "${idToken:-}" ] || [ -z "${servicePrincipalId:-}" ] || [ -z "${tenantId:-}" ]; then
              echo "ERROR: AzureCLI did not expose the workload identity federation credentials required by Terraform." >&2
              exit 1
            fi
            export ARM_USE_OIDC=true
            export ARM_OIDC_TOKEN="${idToken}"
            export ARM_CLIENT_ID="${servicePrincipalId}"
            export ARM_TENANT_ID="${tenantId}"
            export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

            repo_root="$(Build.SourcesDirectory)/foodport-tf"
            alt_repo_root="$(Pipeline.Workspace)/foodport-tf"
            if [ -d "$repo_root/dev-vm" ]; then
              cd "$repo_root/dev-vm"
            elif [ -d "$alt_repo_root/dev-vm" ]; then
              cd "$alt_repo_root/dev-vm"
            else
              echo "ERROR: Terraform repo path not found."
              echo "Expected one of:"
              echo "  $repo_root/dev-vm"
              echo "  $alt_repo_root/dev-vm"
              echo "$(Build.SourcesDirectory) contents:"
              ls -la "$(Build.SourcesDirectory)" || true
              echo "$(Pipeline.Workspace) contents:"
              ls -la "$(Pipeline.Workspace)" || true
              exit 1
            fi

            if [ -z "${SSH_PUBLIC_KEY:-}" ]; then
              echo "ERROR: sshPublicKey pipeline variable is not defined or is empty."
              exit 1
            fi
            export TF_VAR_ssh_public_key="${SSH_PUBLIC_KEY}"
            export TF_VAR_existing_network_rg="$(existingNetworkRg)"
            export TF_VAR_existing_vnet_name="$(existingVnetName)"
            export TF_VAR_existing_subnet_name="$(existingSubnetName)"

            terraform init -input=false

            SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
            NIC_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/CFDC-FoodPort-Portal-rg/providers/Microsoft.Network/networkInterfaces/CFDC-FoodPort-dev-vm-24.04645_z1"
            VM_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/CFDC-FoodPort-Portal-rg/providers/Microsoft.Compute/virtualMachines/CFDC-FoodPort-portal-dev-vm-24.04"

            import_if_present() {
              local ADDRESS="$1"
              local RESOURCE_ID="$2"
              local RESOURCE_RESULT

              if terraform state show "$ADDRESS" >/dev/null 2>&1; then
                return 0
              fi

              if RESOURCE_RESULT="$(az resource show --ids "$RESOURCE_ID" --query id -o tsv 2>&1)"; then
                echo "Importing existing Azure resource into Terraform state: $ADDRESS."
                terraform import -input=false "$ADDRESS" "$RESOURCE_ID"
              elif grep -Fq "ResourceNotFound" <<< "$RESOURCE_RESULT" || grep -Fq "NotFound" <<< "$RESOURCE_RESULT"; then
                echo "Azure resource does not exist yet: $RESOURCE_ID."
              else
                printf '%s\n' "$RESOURCE_RESULT" >&2
                echo "ERROR: Could not determine whether Azure resource exists: $RESOURCE_ID." >&2
                return 1
              fi
            }

            import_if_present azurerm_network_interface.dev_vm "$NIC_ID"
            import_if_present azurerm_linux_virtual_machine.dev_vm "$VM_ID"

            terraform plan -input=false -out=tfplan
            terraform apply -input=false -auto-approve tfplan

            VM_IP="$(terraform output -raw dev_vm_private_ip)"
            VM_PRINCIPAL_ID="$(terraform output -raw dev_vm_principal_id)"
            echo "$VM_IP" > vm_ip.txt
            echo "$VM_PRINCIPAL_ID" > vm_principal_id.txt
            mkdir -p "$(Pipeline.Workspace)/dev-vm"
            cp vm_ip.txt "$(Pipeline.Workspace)/dev-vm/vm_ip.txt"
            cp vm_principal_id.txt "$(Pipeline.Workspace)/dev-vm/vm_principal_id.txt"
      - task: PublishPipelineArtifact@1
        displayName: Publish VM connection and identity artifact
        inputs:
          targetPath: '$(Pipeline.Workspace)/dev-vm'
          artifact: 'devVm'

    - ${{ if parameters.destroy }}:
      - task: AzureCLI@2
        displayName: Destroy Terraform-managed Dev VM
        env:
          SSH_PUBLIC_KEY: $(sshPublicKey)
          CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
          NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt
        inputs:
          azureSubscription: ${{ parameters.azureServiceConnection }}
          addSpnToEnvironment: true
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            if [ -z "${idToken:-}" ] || [ -z "${servicePrincipalId:-}" ] || [ -z "${tenantId:-}" ]; then
              echo "ERROR: AzureCLI did not expose the workload identity federation credentials required by Terraform." >&2
              exit 1
            fi
            export ARM_USE_OIDC=true
            export ARM_OIDC_TOKEN="${idToken}"
            export ARM_CLIENT_ID="${servicePrincipalId}"
            export ARM_TENANT_ID="${tenantId}"
            export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

            cd "$(Pipeline.Workspace)/foodport-tf/dev-vm"
            if [ -z "${SSH_PUBLIC_KEY:-}" ]; then
              echo "ERROR: sshPublicKey pipeline variable is not defined or is empty."
              exit 1
            fi
            export TF_VAR_ssh_public_key="${SSH_PUBLIC_KEY}"
            export TF_VAR_existing_network_rg="$(existingNetworkRg)"
            export TF_VAR_existing_vnet_name="$(existingVnetName)"
            export TF_VAR_existing_subnet_name="$(existingSubnetName)"

            terraform init -input=false

            if [ -n "${subscriptionId:-}" ]; then
              SUBSCRIPTION_ID="${subscriptionId}"
            else
              SUBSCRIPTION_ID="${ARM_SUBSCRIPTION_ID}"
            fi

            NIC_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/CFDC-FoodPort-Portal-rg/providers/Microsoft.Network/networkInterfaces/CFDC-FoodPort-dev-vm-24.04645_z1"
            VM_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/CFDC-FoodPort-Portal-rg/providers/Microsoft.Compute/virtualMachines/CFDC-FoodPort-portal-dev-vm-24.04"

            import_if_present() {
              local ADDRESS="$1"
              local RESOURCE_ID="$2"
              local RESOURCE_RESULT

              if terraform state show "$ADDRESS" >/dev/null 2>&1; then
                return 0
              fi

              if RESOURCE_RESULT="$(az resource show --ids "$RESOURCE_ID" --query id -o tsv 2>&1)"; then
                echo "Importing existing Azure resource into Terraform state: $ADDRESS."
                terraform import -input=false "$ADDRESS" "$RESOURCE_ID"
              elif grep -Fq "ResourceNotFound" <<< "$RESOURCE_RESULT" || grep -Fq "NotFound" <<< "$RESOURCE_RESULT"; then
                echo "Azure resource does not exist yet: $RESOURCE_ID."
              else
                printf '%s\n' "$RESOURCE_RESULT" >&2
                echo "ERROR: Could not determine whether Azure resource exists: $RESOURCE_ID." >&2
                return 1
              fi
            }

            import_if_present azurerm_network_interface.dev_vm "$NIC_ID"
            import_if_present azurerm_linux_virtual_machine.dev_vm "$VM_ID"

            STATE_ADDRESSES="$(terraform state list)"
            for ADDRESS in \
              azurerm_ssh_public_key.dev_vm \
              azurerm_role_assignment.dev_vm_key_vault_secrets_user \
              azurerm_role_assignment.dev_vm_batch_data_contributor; do
              if grep -Fxq "$ADDRESS" <<<"$STATE_ADDRESSES"; then
                terraform state rm "$ADDRESS"
              fi
            done

            terraform destroy -input=false -auto-approve

- stage: BootstrapRemoteVm
  displayName: 'Bootstrap remote VM'
  condition: >-
    and(
      ne(${{ parameters.destroy }}, true),
      eq(${{ parameters.bootstrapRemoteVm }}, true),
      in(dependencies.ProvisionDevVm.result, 'Succeeded', 'SucceededWithIssues')
    )
  dependsOn:
    - ProvisionDevVm
  jobs:
  - job: Bootstrap
    displayName: 'Bootstrap remote VM'
    pool:
      ${{ if eq(parameters.useHostedAgent, true) }}:
        vmImage: ${{ parameters.hostedVmImage }}
      ${{ if ne(parameters.useHostedAgent, true) }}:
        name: CFDC-FoodPort-MDP-pool
    steps:
    - task: DownloadSecureFile@1
      name: rootCA
      inputs:
        secureFile: 'GoC-GdC-Root-A.crt'

    - script: |
        set -euo pipefail
        if ! command -v update-ca-certificates >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates
        fi
        sudo install -D -m 0644 "$(rootCA.secureFilePath)" /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt
        sudo update-ca-certificates
        if ! command -v curl >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl
        fi
        curl --fail --show-error --silent --location --connect-timeout 10 --max-time 30 \
          --output /dev/null --write-out 'Bootstrap agent PyPI TLS check passed (HTTP %{http_code})\n' \
          https://pypi.org/simple/pip/
      displayName: Trust GoC root CA before artifact download

    - task: DownloadPipelineArtifact@2
      displayName: 'Download dev VM artifact'
      inputs:
        artifact: 'devVm'
        path: '$(Pipeline.Workspace)'

    - script: |
        set -euo pipefail

        artifact_dir="$(Pipeline.Workspace)"
        echo "Listing downloaded artifact contents: ${artifact_dir}"
        find "${artifact_dir}" -maxdepth 8 -type f | sort

        artifact_file=$(find "${artifact_dir}" -type f -name 'vm_ip.txt' | head -n 1 || true)
        if [ -z "${artifact_file:-}" ]; then
          echo "ERROR: dev VM artifact file vm_ip.txt not found under ${artifact_dir}"
          echo "Downloaded workspace contents:"
          find "${artifact_dir}" -maxdepth 3 -mindepth 1 | sort
          exit 1
        fi

        TARGET_HOST=$(cat "${artifact_file}")
        if [ -z "${TARGET_HOST:-}" ]; then
          echo "ERROR: dev VM artifact file is empty: ${artifact_file}"
          exit 1
        fi

        echo "Found vm_ip.txt at: ${artifact_file}"
        echo "##vso[task.setvariable variable=TARGET_HOST]$TARGET_HOST"
      displayName: 'Load TARGET_HOST from dev VM artifact'

    - task: DownloadSecureFile@1
      name: tlsCert
      inputs:
        secureFile: 'cloud-nuage.crt'

    - task: DownloadSecureFile@1
      name: tlsKey
      inputs:
        secureFile: 'cloud-nuage.key'

    - task: DownloadSecureFile@1
      name: tlsChain
      inputs:
        secureFile: 'cloud-nuage-chain.pem'

    - task: DownloadSecureFile@1
      name: sshKey
      inputs:
        secureFile: 'portal_ssh_key'

    - script: |
        set -euo pipefail
        chmod 600 "$(sshKey.secureFilePath)"
        REMOTE_DIR="/home/${TARGET_SSH_USER}/FoodPort/olc_genomics_portal"
        scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$(sshKey.secureFilePath)" -P "${TARGET_SSH_PORT}" "$(rootCA.secureFilePath)" "${TARGET_SSH_USER}@${TARGET_HOST}:/tmp/GoC-GdC-Root-A.crt"
        scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$(sshKey.secureFilePath)" -P "${TARGET_SSH_PORT}" "$(tlsCert.secureFilePath)" "${TARGET_SSH_USER}@${TARGET_HOST}:/tmp/cloud-nuage.crt"
        scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$(sshKey.secureFilePath)" -P "${TARGET_SSH_PORT}" "$(tlsKey.secureFilePath)" "${TARGET_SSH_USER}@${TARGET_HOST}:/tmp/cloud-nuage.key"
        scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$(sshKey.secureFilePath)" -P "${TARGET_SSH_PORT}" "$(tlsChain.secureFilePath)" "${TARGET_SSH_USER}@${TARGET_HOST}:/tmp/cloud-nuage-chain.pem"
        scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$(sshKey.secureFilePath)" -P "${TARGET_SSH_PORT}" "$(sshKey.secureFilePath)" "${TARGET_SSH_USER}@${TARGET_HOST}:/tmp/portal_ssh_key"
        scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$(sshKey.secureFilePath)" -P "${TARGET_SSH_PORT}" "$(Build.SourcesDirectory)/ci/github_ssh_config" "${TARGET_SSH_USER}@${TARGET_HOST}:/tmp/github_ssh_config"
        if [ -n "${SSH_PUBLIC_KEY:-}" ]; then
          derived_pub=$(ssh-keygen -y -f "$(sshKey.secureFilePath)" 2>/tmp/sshkeygen.err || true)
          if [ -z "$derived_pub" ]; then
            echo "WARNING: failed to derive public key from private key file; skipping public-key matching check."
            echo "ssh-keygen details:"
            sed 's/^/  /' /tmp/sshkeygen.err || true
          elif [ "$derived_pub" != "$SSH_PUBLIC_KEY" ]; then
            echo "ERROR: the private key in secure file does not match sshPublicKey"
            echo "Please provide the matching private key for the public key used by Terraform."
            exit 1
          fi
          rm -f /tmp/sshkeygen.err
        fi
        ssh -o StrictHostKeyChecking=no -i "$(sshKey.secureFilePath)" -p "${TARGET_SSH_PORT}" "${TARGET_SSH_USER}@${TARGET_HOST}" <<EOF
          set -e
          sudo cp /tmp/GoC-GdC-Root-A.crt /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt
          sudo chmod 644 /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt
          sudo update-ca-certificates
          curl --fail --show-error --silent --location --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out 'Target VM PyPI TLS check passed (HTTP %{http_code})\n' \
            https://pypi.org/simple/pip/
          printf '%s\n' 'export CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt' 'export PIP_CERT=/etc/ssl/certs/ca-certificates.crt' 'export REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt' 'export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt' | sudo tee /etc/profile.d/foodport-ca-certificates.sh >/dev/null
          sudo chmod 644 /etc/profile.d/foodport-ca-certificates.sh
          sudo mkdir -p /etc/foodport/tls
          sudo cp /tmp/GoC-GdC-Root-A.crt /etc/foodport/tls/GoC-GdC-Root-A.crt
          sudo chmod 644 /etc/foodport/tls/GoC-GdC-Root-A.crt
          sudo cp /tmp/cloud-nuage.crt /etc/foodport/tls/cloud-nuage.crt
          sudo cp /tmp/cloud-nuage.key /etc/foodport/tls/cloud-nuage.key
          sudo cp /tmp/cloud-nuage-chain.pem /etc/foodport/tls/cloud-nuage-chain.pem
          sudo chmod 644 /etc/foodport/tls/cloud-nuage.crt
          sudo chmod 600 /etc/foodport/tls/cloud-nuage.key
          sudo chmod 644 /etc/foodport/tls/cloud-nuage-chain.pem
          sudo mkdir -p "/home/${TARGET_SSH_USER}/.ssh"
          sudo chown "${TARGET_SSH_USER}:${TARGET_SSH_USER}" "/home/${TARGET_SSH_USER}/.ssh"
          sudo chmod 700 "/home/${TARGET_SSH_USER}/.ssh"
          sudo mv /tmp/portal_ssh_key "/home/${TARGET_SSH_USER}/.ssh/portal_ssh_key"
          sudo chmod 600 "/home/${TARGET_SSH_USER}/.ssh/portal_ssh_key"
          sudo chown "${TARGET_SSH_USER}:${TARGET_SSH_USER}" "/home/${TARGET_SSH_USER}/.ssh/portal_ssh_key"
          sudo cp /tmp/github_ssh_config "/home/${TARGET_SSH_USER}/.ssh/config"
          sudo chmod 600 "/home/${TARGET_SSH_USER}/.ssh/config"
          sudo chown "${TARGET_SSH_USER}:${TARGET_SSH_USER}" "/home/${TARGET_SSH_USER}/.ssh/config"
          ssh-keyscan github.com >> "/home/${TARGET_SSH_USER}/.ssh/known_hosts"
          sudo chmod 644 "/home/${TARGET_SSH_USER}/.ssh/known_hosts"
          sudo chown "${TARGET_SSH_USER}:${TARGET_SSH_USER}" "/home/${TARGET_SSH_USER}/.ssh/known_hosts"
          git config --global user.name "adamkoziol"
          git config --global user.email "adam.koziol@inspection.gc.ca"
          sudo rm -f /etc/apt/sources.list.d/docker.list
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg lsb-release git python3 python3-pip python3-venv python3-dev apt-transport-https software-properties-common libpq-dev
          curl --fail --show-error --silent --location --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out 'Target VM PyPI TLS check passed (HTTP %{http_code})\n' \
            https://pypi.org/simple/pip/
          sudo mkdir -p /etc/pip
          echo -e "[global]\ncert = /etc/ssl/certs/ca-certificates.crt" | sudo tee /etc/pip.conf

          if ! command -v docker >/dev/null 2>&1; then
            echo "DEBUG: docker not installed, entering docker bootstrap block"
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --batch --yes --no-tty --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
            sudo mkdir -p /etc/apt/sources.list.d
            arch="\$(dpkg --print-architecture)"
            codename="\$(lsb_release -cs)"
            ts="\$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sudo rm -f /etc/apt/sources.list.d/docker.list
            sudo bash -lc "printf '### generated: %s\n' \"\$ts\" > /etc/apt/sources.list.d/docker.list"
            sudo bash -lc "printf 'deb [arch=%s signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu %s stable\n' \"\$arch\" \"\$codename\" >> /etc/apt/sources.list.d/docker.list"
            sudo ls -l /etc/apt/sources.list.d/docker.list
            sudo cat /etc/apt/sources.list.d/docker.list
            sudo DEBIAN_FRONTEND=noninteractive apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io || true

            if ! command -v docker >/dev/null 2>&1; then
              echo 'WARNING: docker-ce install failed, trying ubuntu docker.io fallback'
              sudo DEBIAN_FRONTEND=noninteractive apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io || true
            fi

            if ! command -v docker >/dev/null 2>&1; then
              echo 'WARNING: docker.io fallback failed, trying get.docker.com convenience script'
              curl -fsSL https://get.docker.com | sudo sh || true
            fi

            if ! command -v docker >/dev/null 2>&1; then
              echo 'ERROR: Docker CLI is still unavailable after primary and fallback installs.'
              echo 'DEBUG: apt-cache policy docker-ce docker-ce-cli containerd.io docker.io'
              sudo apt-cache policy docker-ce docker-ce-cli containerd.io docker.io || true
              exit 1
            fi
            sudo usermod -aG docker "${TARGET_SSH_USER}"
          fi

          if ! docker compose version >/dev/null 2>&1; then
            echo 'DEBUG: docker compose not available, attempting install'
            sudo apt-get install -y docker-compose-plugin
          fi

          echo 'DEBUG: verifying Docker installation'
          if ! command -v docker >/dev/null 2>&1; then
            echo 'ERROR: Docker CLI is not available after bootstrap installation.'
            echo 'DEBUG: command -v docker returned:'
            command -v docker || true
            exit 1
          fi
          echo 'DEBUG: docker version:'
          docker --version || true

          echo 'DEBUG: verifying Docker Compose installation'
          if ! docker compose version >/dev/null 2>&1; then
            echo 'ERROR: Docker Compose is not available after bootstrap installation.'
            echo 'DEBUG: docker compose version result:'
            docker compose version || true
            exit 1
          fi

          if ! command -v az >/dev/null 2>&1; then
            installer="\$(mktemp)"
            trap 'rm -f -- "\$installer"' EXIT
            curl --fail --show-error --location --retry 3 --retry-all-errors --output "\$installer" https://aka.ms/InstallAzureCLIDeb
            sudo bash "\$installer"
          fi

          if [ ! -x "/home/${TARGET_SSH_USER}/miniconda/bin/conda" ]; then
            curl -fsSL https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -o /tmp/miniconda.sh
            bash /tmp/miniconda.sh -b -p "/home/${TARGET_SSH_USER}/miniconda"
            rm /tmp/miniconda.sh
          else
            echo "Conda already installed at /home/${TARGET_SSH_USER}/miniconda"
          fi
          if ! grep -qxF "export PATH=\"/home/${TARGET_SSH_USER}/miniconda/bin:\$PATH\"" "/home/${TARGET_SSH_USER}/.bashrc"; then
            echo "export PATH=\"/home/${TARGET_SSH_USER}/miniconda/bin:\$PATH\"" >> "/home/${TARGET_SSH_USER}/.bashrc"
          fi
          export PATH="/home/${TARGET_SSH_USER}/miniconda/bin:\$PATH"
          /home/${TARGET_SSH_USER}/miniconda/bin/conda init bash || true
          export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
          export REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
          export CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
          export PIP_CERT=/etc/ssl/certs/ca-certificates.crt
          CONDA_BIN="/home/${TARGET_SSH_USER}/miniconda/bin/conda"
          "\$CONDA_BIN" config --set always_yes yes --set changeps1 no
          "\$CONDA_BIN" config --set ssl_verify /etc/ssl/certs/ca-certificates.crt
          "\$CONDA_BIN" tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main
          "\$CONDA_BIN" tos accept --override-channels --channel https://repo.anaconda.com/pkgs/r
          "\$CONDA_BIN" config --prepend channels conda-forge
          "\$CONDA_BIN" config --prepend channels bioconda
          "\$CONDA_BIN" config --prepend channels olcbioinformatics
          "\$CONDA_BIN" config --set channel_priority strict
          "\$CONDA_BIN" config --set solver libmamba
          if ! command -v mamba >/dev/null 2>&1; then
            "\$CONDA_BIN" install -q -n base --yes --solver=libmamba --override-channels -c conda-forge mamba
          fi
        EOF
      env:
        SSH_PUBLIC_KEY: $(sshPublicKey)
      displayName: 'Bootstrap remote VM with Docker, Docker Compose, Git, Python, Conda, and Azure CLI'


- stage: DeployPortal
  displayName: 'Deploy portal'
  variables:
  - group: FoodPort-Dev-Portal-Secrets
  dependsOn:
    - ProvisionDevVm
    - BootstrapRemoteVm
  condition: >-
    and(
      ne(${{ parameters.destroy }}, true),
      in(dependencies.ProvisionDevVm.result, 'Succeeded', 'SucceededWithIssues'),
      in(dependencies.BootstrapRemoteVm.result, 'Succeeded', 'SucceededWithIssues', 'Skipped')
    )
  jobs:
  - job: Deploy
    displayName: 'Deploy portal'
    pool:
      ${{ if eq(parameters.useHostedAgent, true) }}:
        vmImage: ${{ parameters.hostedVmImage }}
      ${{ if ne(parameters.useHostedAgent, true) }}:
        name: CFDC-FoodPort-MDP-pool
    steps:
    - task: DownloadSecureFile@1
      name: rootCA
      inputs:
        secureFile: 'GoC-GdC-Root-A.crt'

    - script: |
        set -euo pipefail
        if ! command -v update-ca-certificates >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates
        fi
        sudo install -D -m 0644 "$(rootCA.secureFilePath)" /usr/local/share/ca-certificates/GoC-GdC-Root-A.crt
        sudo update-ca-certificates
      displayName: Trust GoC root CA before artifact download

    - script: |
        cp "$(rootCA.secureFilePath)" "$(Build.SourcesDirectory)/redmine/GoC-GdC-Root-A.crt"
        cp "$(rootCA.secureFilePath)" "$(Build.SourcesDirectory)/rag/GoC-GdC-Root-A.crt"
        cp "$(rootCA.secureFilePath)" "$(Build.SourcesDirectory)/GoC-GdC-Root-A.crt"
      displayName: Copy root CA into Docker build contexts

    - script: |
        echo 'Skipping local Key Vault fetch and env validation; this will happen on the target VM.'
      displayName: 'Skip local Key Vault fetch/validation'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download dev VM artifact for deploy'
      inputs:
        artifact: 'devVm'
        path: '$(Pipeline.Workspace)'

    - script: |
        set -e
        ARTIFACT_DIR="$(Pipeline.Workspace)"
        VM_IP_FILE=$(find "$ARTIFACT_DIR" -type f -name 'vm_ip.txt' | head -n 1 || true)
        if [ -z "${VM_IP_FILE:-}" ]; then
          echo "ERROR: vm_ip.txt not found under $ARTIFACT_DIR"
          find "$ARTIFACT_DIR" -maxdepth 6 -type f | sort
          exit 1
        fi
        VM_IP=$(cat "$VM_IP_FILE")
        echo "##vso[task.setvariable variable=TARGET_HOST]$VM_IP"
      displayName: 'Set target VM IP variable'

    - task: DownloadSecureFile@1
      name: sshKey
      inputs:
        secureFile: 'portal_ssh_key'

    - script: |
        set -euo pipefail
        chmod 600 "$(sshKey.secureFilePath)"
        echo 'DEBUG: downloaded ssh key for remote restart'
      displayName: 'Prepare SSH key for remote restart'

    - script: |
        set -euo pipefail
        chmod 600 "$(sshKey.secureFilePath)"
        REMOTE_DIR="/home/${TARGET_SSH_USER}/FoodPort/olc_genomics_portal"

        echo "Copying portal source tree to ${TARGET_HOST}:${REMOTE_DIR}"
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$(sshKey.secureFilePath)" -p "${TARGET_SSH_PORT}" "${TARGET_SSH_USER}@${TARGET_HOST}" "sudo rm -rf '$REMOTE_DIR' && sudo mkdir -p '$REMOTE_DIR' && sudo chown ${TARGET_SSH_USER}:${TARGET_SSH_USER} '$REMOTE_DIR'"
        tar -C "$(Build.SourcesDirectory)" -cf - . | ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$(sshKey.secureFilePath)" -p "${TARGET_SSH_PORT}" "${TARGET_SSH_USER}@${TARGET_HOST}" "tar -C '$REMOTE_DIR' -xvf -"
        scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$(sshKey.secureFilePath)" -P "${TARGET_SSH_PORT}" "$(sshKey.secureFilePath)" "${TARGET_SSH_USER}@${TARGET_HOST}:/tmp/portal_ssh_key"

        ssh -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i "$(sshKey.secureFilePath)" \
            -p "${TARGET_SSH_PORT}" \
            "${TARGET_SSH_USER}@${TARGET_HOST}" <<EOF
        set -euo pipefail

        REMOTE_DIR="/home/${TARGET_SSH_USER}/FoodPort/olc_genomics_portal"

        cd "\$REMOTE_DIR"

        if [ -d .git ]; then
          git remote set-url origin git@github.com:OLC-Bioinformatics/olc_genomics_portal.git
          echo "Updated Git remotes:"
          git remote -v
        else
          echo "WARNING: \$REMOTE_DIR has no .git directory; skipping git remote set-url"
        fi
        EOF

        secret_dir="$(mktemp -d)"
        remote_secret_dir=''
        cleanup_secret_staging() {
          if ! rm -rf -- "$secret_dir"; then
            echo 'WARNING: Could not remove the local temporary secret directory.' >&2
          fi
          if [ -n "$remote_secret_dir" ] && \
             ! ssh -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  -i "$(sshKey.secureFilePath)" \
                  -p "${TARGET_SSH_PORT}" \
                  "${TARGET_SSH_USER}@${TARGET_HOST}" \
                  "rm -rf -- '$remote_secret_dir'"; then
            echo 'WARNING: Could not remove the remote temporary secret directory.' >&2
          fi
        }
        trap cleanup_secret_staging EXIT
        chmod 700 "$secret_dir"
        python3 - "$secret_dir" "$TARGET_HOST" <<'PY'
        import os
        import sys
        from pathlib import Path

        secret_names = (
            "FOODPORT_DJANGO_SECRET_KEY",
            "FOODPORT_DJANGO_SECRET_KEY_BASE",
            "REDMINE_DB_PASSWORD",
            "RAG_DB_PASSWORD",
            "AZURE_ACCOUNT_NAME",
            "AZURE_ACCOUNT_KEY",
            "BATCH_ACCOUNT_NAME",
            "BATCH_ACCOUNT_URL",
            "BATCH_ACCOUNT_KEY",
            "BATCH_ACCOUNT_SUBNET",
            "VM_IMAGE",
            "COWBAT_NODE_AGENT_SKU",
            "AMPLISEQ_IMAGE",
            "AMPLISEQ_NODE_AGENT_SKU",
            "COWSNPHR_IMAGE",
            "COWSNPHR_NODE_AGENT_SKU",
            "AD_APP_ID",
            "AD_APP_SECRET_ID",
            "AD_APP_SECRET",
            "ENTRA_ID_CLIENT_ID",
            "ENTRA_ID_CLIENT_SECRET",
            "ENTRA_TENANT_ID",
            "REDMINE_DEFAULT_FROM",
            "EMAIL_HOST_USER",
            "EMAIL_HOST_PASSWORD",
            "EMAIL_RELAY_SECRET",
            "DB_NAME",
            "DB_USER",
            "DB_PASS",
            "DB_SERVICE",
            "DB_PORT",
            "DJANGO_EMAIL_BACKEND",
            "SENTRY_DSN",
            "ENVIRONMENT",
            "CONNECTION_STRING",
            "SITE_URL",
            "DJANGO_SERVER_NAME",
            "REDMINE_SERVER_NAME",
            "API_KEY",
            "DEV_API_KEY",
            "MARIA_DB_ROOT_PASSWORD",
            "MYSQL_PASSWORD",
            "SUBSCRIPTION_ID",
            "TENANT_ID",
            "CLIENT_ID",
            "CLIENT_SECRET",
            "RESOURCE_GROUP_NAME",
            "STORAGE_ACCOUNT_NAME",
        )
        env_file_names = {
            "FOODPORT_DJANGO_SECRET_KEY": "SECRET_KEY",
            "FOODPORT_DJANGO_SECRET_KEY_BASE": "SECRET_KEY_BASE",
        }
        dotenv_names = (
            "SUBSCRIPTION_ID",
            "TENANT_ID",
            "CLIENT_ID",
            "CLIENT_SECRET",
            "STORAGE_ACCOUNT_NAME",
            "RESOURCE_GROUP_NAME",
            "CONNECTION_STRING",
            "RAG_DB_PASSWORD",
            "MYSQL_PASSWORD",
            "MARIA_DB_ROOT_PASSWORD",
            "DB_PASS",
            "EMAIL_HOST_USER",
            "EMAIL_HOST_PASSWORD",
        )

        if os.environ.get("FOODPORT_SECRET_VARIABLES_READY", "").lower() != "true":
            raise SystemExit(
                "Set FOODPORT_SECRET_VARIABLES_READY=true in "
                "FoodPort-Dev-Portal-Secrets after entering all secret values."
            )

        issues = []
        for name in secret_names:
            if name not in os.environ:
                issues.append(
                    f"{name}: not present in the task environment; check the "
                    "variable-group reference and task env mapping."
                )
                continue

            value = os.environ[name]
            if not value.strip():
                issues.append(
                    f"{name}: present in the task environment but empty or "
                    "whitespace-only."
                )
            elif value == f"$({name})":
                issues.append(
                    f"{name}: Azure Pipelines macro was not expanded; check "
                    "the variable name, group scope, and pipeline authorization."
                )
            elif value == "__REPLACE_ME__":
                issues.append(
                    f"{name}: still has the __REPLACE_ME__ placeholder value."
                )

        if issues:
            raise SystemExit(
                "Invalid variable-group value(s):\n  - "
                + "\n  - ".join(issues)
            )

        for name in secret_names:
            if "\n" in os.environ[name] or "\r" in os.environ[name]:
                raise SystemExit(f"{name} must be a single-line value.")

        output_dir = Path(sys.argv[1])
        target_host = sys.argv[2]
        env_lines = [
            "MICROSOFT_AUTH_ENABLED=False",
            f"DJANGO_ALLOWED_HOSTS=0.0.0.0,localhost,127.0.0.1,{target_host}",
        ]
        env_lines.extend(
            f"{env_file_names.get(name, name)}={os.environ[name]}"
            for name in secret_names
        )
        (output_dir / "env").write_text("\n".join(env_lines) + "\n", encoding="utf-8")

        dotenv_lines = [
            "MICROSOFT_AUTH_ENABLED=False",
            f"DJANGO_ALLOWED_HOSTS=0.0.0.0,localhost,127.0.0.1,{target_host}",
        ]
        dotenv_lines.extend(f"{name}={os.environ[name]}" for name in dotenv_names)
        dotenv_lines.extend(("FLOWER_USER=", "FLOWER_PASSWORD="))
        (output_dir / ".env").write_text(
            "\n".join(dotenv_lines) + "\n", encoding="utf-8"
        )
        os.chmod(output_dir / "env", 0o600)
        os.chmod(output_dir / ".env", 0o600)
        PY

        remote_secret_dir="/tmp/foodport-secrets-$(Build.BuildId)"
        safe_remote_secret_dir=$(printf '%q' "$remote_secret_dir")
        tar -C "$secret_dir" -cf - env .env | \
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -i "$(sshKey.secureFilePath)" \
              -p "${TARGET_SSH_PORT}" \
              "${TARGET_SSH_USER}@${TARGET_HOST}" \
              "umask 077; install -d -m 700 $safe_remote_secret_dir; tar -C $safe_remote_secret_dir -xf -"

        safe_REMOTE_DIR=$(printf '%q' "$REMOTE_DIR")
        safe_TARGET_HOST=$(printf '%q' "${TARGET_HOST:-}")
        safe_REMOTE_SECRET_DIR=$(printf '%q' "$remote_secret_dir")

        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$(sshKey.secureFilePath)" -p "${TARGET_SSH_PORT}" "${TARGET_SSH_USER}@${TARGET_HOST}" \
          "REMOTE_DIR=$safe_REMOTE_DIR TARGET_HOST=$safe_TARGET_HOST REMOTE_SECRET_DIR=$safe_REMOTE_SECRET_DIR bash -s" <<'EOF'
          set -euo pipefail
          umask 077
          ca_bundle=/etc/ssl/certs/ca-certificates.crt
          if [ ! -r "$ca_bundle" ]; then
            echo "ERROR: system CA bundle is missing or unreadable: $ca_bundle" >&2
            exit 1
          fi
          export CURL_CA_BUNDLE="$ca_bundle"
          export PIP_CERT="$ca_bundle"
          export REQUESTS_CA_BUNDLE="$ca_bundle"
          export SSL_CERT_FILE="$ca_bundle"

          trap 'rm -rf -- "$REMOTE_SECRET_DIR"' EXIT

          env_file="$REMOTE_DIR/env"
          dotenv_file="$REMOTE_DIR/.env"
          install -m 600 "$REMOTE_SECRET_DIR/env" "$env_file"
          install -m 600 "$REMOTE_SECRET_DIR/.env" "$dotenv_file"

          cd "$REMOTE_DIR"

          # --- Deploy only the intended dev branch ---
          if [ ! -d .git ]; then
            echo "ERROR: $REMOTE_DIR is not a Git checkout; cannot verify the dev branch." >&2
            exit 1
          fi
          echo "Fetching origin/dev"
          git fetch origin +refs/heads/dev:refs/remotes/origin/dev
          if git show-ref --verify --quiet refs/heads/dev; then
            git checkout dev
          else
            git checkout --track -b dev origin/dev
          fi
          git merge --ff-only origin/dev
          checked_out_branch="$(git branch --show-current)"
          checked_out_commit="$(git rev-parse HEAD)"
          expected_commit="$(git rev-parse origin/dev)"
          if [ "$checked_out_branch" != "dev" ] || \
             [ "$checked_out_commit" != "$expected_commit" ]; then
            echo "ERROR: expected origin/dev at $expected_commit, got $checked_out_branch at $checked_out_commit." >&2
            exit 1
          fi
          echo "Deploying dev branch commit $checked_out_commit"

          # Nginx serves these public assets as www-data; the deployment umask is 077.
          find olc_webportalv2/static/css olc_webportalv2/static/js -type d -exec chmod a+rx {} +
          find olc_webportalv2/static/css olc_webportalv2/static/js -type f -exec chmod a+r {} +

          python3 "$REMOTE_DIR/remote_deploy_env.py"

          CONDA_BIN="$HOME/miniconda/bin/conda"
          MAMBA_BIN="$HOME/miniconda/bin/mamba"

          # --- Create conda environment if missing ---
          environment_created=false
          if ! "$CONDA_BIN" env list | grep -qE '(^|/)\bfoodport\b'; then
            echo "Creating conda environment 'foodport'"
            if [ -x "$MAMBA_BIN" ]; then
              "$MAMBA_BIN" create -n foodport --override-channels -c conda-forge python=3.14 -y
            else
              "$CONDA_BIN" config --set solver libmamba
              "$CONDA_BIN" create --solver=libmamba -n foodport python=3.14 -y
            fi
            environment_created=true
          else
            echo "Conda environment 'foodport' already exists"
          fi

          "$CONDA_BIN" config --set ssl_verify "$ca_bundle"
          "$CONDA_BIN" env config vars set -n foodport \
            CURL_CA_BUNDLE="$ca_bundle" \
            PIP_CERT="$ca_bundle" \
            REQUESTS_CA_BUNDLE="$ca_bundle" \
            SSL_CERT_FILE="$ca_bundle"

          # --- Refresh the host environment only when its requirements change ---
          requirements_hash_file="$HOME/miniconda/envs/foodport/.requirements-base.sha256"
          requirements_hash="$(sha256sum "$REMOTE_DIR/requirements/base.txt" | cut -d ' ' -f1)"
          if [ "$environment_created" = true ] \
            || [ ! -f "$requirements_hash_file" ] \
            || [ "$(cat "$requirements_hash_file")" != "$requirements_hash" ]; then
            echo "Installing Python dependencies into 'foodport' environment"
            "$CONDA_BIN" run -n foodport python -m pip install --disable-pip-version-check --upgrade pip
            "$CONDA_BIN" run -n foodport python -m pip install --disable-pip-version-check --upgrade -r "$REMOTE_DIR/requirements/base.txt"
            printf '%s\n' "$requirements_hash" > "${requirements_hash_file}.tmp"
            mv "${requirements_hash_file}.tmp" "$requirements_hash_file"
          else
            echo "Python requirements unchanged; skipping host dependency installation"
          fi

          "$CONDA_BIN" run -n foodport python -c "import requests; response = requests.get('https://pypi.org/simple/pip/', timeout=20); response.raise_for_status(); print('Conda Requests TLS check passed')"

          if command -v docker >/dev/null 2>&1; then
            rm -f celerybeat-schedule.db celerybeat.pid
            docker compose down
            docker compose up -d
            docker compose exec -T web python -c "import requests; response = requests.get('https://pypi.org/simple/pip/', timeout=20); response.raise_for_status(); print('Web container TLS check passed')"
            exit 0
          fi

          if sudo -n true 2>/dev/null; then
            sudo -n env PATH="$PATH" docker compose version || true
            sudo rm -f celerybeat-schedule.db celerybeat.pid
            sudo env PATH="$PATH" docker compose down || true
            sudo env PATH="$PATH" docker compose up -d
            sudo env PATH="$PATH" docker compose exec -T web python -c "import requests; response = requests.get('https://pypi.org/simple/pip/', timeout=20); response.raise_for_status(); print('Web container TLS check passed')"
            exit 0
          fi

          echo 'ERROR: Docker CLI not available on this VM, or sudo requires a password.'
          echo '  - Install Docker and Docker Compose on the target VM.'
          echo '  - Make sure the target user is in the docker group or can run sudo docker commands.'
          if command -v sudo >/dev/null 2>&1; then
            echo 'DEBUG: sudo -l output:'
            sudo -l || true
          fi
          exit 1
        EOF
        remote_secret_dir=''
      displayName: 'Deploy portal on dev VM'
      env:
        FOODPORT_SECRET_VARIABLES_READY: $(FOODPORT_SECRET_VARIABLES_READY)
        FOODPORT_DJANGO_SECRET_KEY: $(foodport_django_secret_key)
        FOODPORT_DJANGO_SECRET_KEY_BASE: $(foodport_django_secret_key_base)
        REDMINE_DB_PASSWORD: $(REDMINE_DB_PASSWORD)
        RAG_DB_PASSWORD: $(RAG_DB_PASSWORD)
        AZURE_ACCOUNT_NAME: $(AZURE_ACCOUNT_NAME)
        AZURE_ACCOUNT_KEY: $(AZURE_ACCOUNT_KEY)
        BATCH_ACCOUNT_NAME: $(BATCH_ACCOUNT_NAME)
        BATCH_ACCOUNT_URL: $(BATCH_ACCOUNT_URL)
        BATCH_ACCOUNT_KEY: $(BATCH_ACCOUNT_KEY)
        BATCH_ACCOUNT_SUBNET: $(BATCH_ACCOUNT_SUBNET)
        VM_IMAGE: $(VM_IMAGE)
        COWBAT_NODE_AGENT_SKU: $(COWBAT_NODE_AGENT_SKU)
        AMPLISEQ_IMAGE: $(AMPLISEQ_IMAGE)
        AMPLISEQ_NODE_AGENT_SKU: $(AMPLISEQ_NODE_AGENT_SKU)
        COWSNPHR_IMAGE: $(COWSNPHR_IMAGE)
        COWSNPHR_NODE_AGENT_SKU: $(COWSNPHR_NODE_AGENT_SKU)
        AD_APP_ID: $(AD_APP_ID)
        AD_APP_SECRET_ID: $(AD_APP_SECRET_ID)
        AD_APP_SECRET: $(AD_APP_SECRET)
        ENTRA_ID_CLIENT_ID: $(ENTRA_ID_CLIENT_ID)
        ENTRA_ID_CLIENT_SECRET: $(ENTRA_ID_CLIENT_SECRET)
        ENTRA_TENANT_ID: $(ENTRA_TENANT_ID)
        REDMINE_DEFAULT_FROM: $(REDMINE_DEFAULT_FROM)
        EMAIL_HOST_USER: $(EMAIL_HOST_USER)
        EMAIL_HOST_PASSWORD: $(EMAIL_HOST_PASSWORD)
        EMAIL_RELAY_SECRET: $(EMAIL_RELAY_SECRET)
        DB_NAME: $(DB_NAME)
        DB_USER: $(DB_USER)
        DB_PASS: $(DB_PASS)
        DB_SERVICE: $(DB_SERVICE)
        DB_PORT: $(DB_PORT)
        DJANGO_EMAIL_BACKEND: $(DJANGO_EMAIL_BACKEND)
        SENTRY_DSN: $(SENTRY_DSN)
        ENVIRONMENT: $(ENVIRONMENT)
        CONNECTION_STRING: $(CONNECTION_STRING)
        SITE_URL: $(SITE_URL)
        DJANGO_SERVER_NAME: $(DJANGO_SERVER_NAME)
        REDMINE_SERVER_NAME: $(REDMINE_SERVER_NAME)
        API_KEY: $(API_KEY)
        DEV_API_KEY: $(DEV_API_KEY)
        MARIA_DB_ROOT_PASSWORD: $(MARIA_DB_ROOT_PASSWORD)
        MYSQL_PASSWORD: $(MYSQL_PASSWORD)
        SUBSCRIPTION_ID: $(SUBSCRIPTION_ID)
        TENANT_ID: $(TENANT_ID)
        CLIENT_ID: $(CLIENT_ID)
        CLIENT_SECRET: $(CLIENT_SECRET)
        RESOURCE_GROUP_NAME: $(RESOURCE_GROUP_NAME)
        STORAGE_ACCOUNT_NAME: $(STORAGE_ACCOUNT_NAME)
